<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="실용음악 입시">
<meta name="application-name" content="실용음악 입시">
<title>실용음악 화성학 · 시창청음 | 입시 학습관</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --txt:#e8eaf0; --muted:#9aa3b2; --accent:#7c5cff; --accent2:#37c2a0;
    --gold:#f2b441; --red:#ef5a78; --green:#37c2a0; --blue:#4ea1ff;
    --radius:16px; --shadow:0 8px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 70% -10%,#1c2030 0%,var(--bg) 55%);
    color:var(--txt);min-height:100vh;line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
  header.top{display:flex;align-items:center;gap:14px;padding:6px 2px 22px}
  .logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-size:24px;box-shadow:var(--shadow)}
  .brand h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
  .brand p{font-size:12.5px;color:var(--muted)}
  /* breadcrumb */
  .crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:18px}
  .crumb b{color:var(--txt)}
  .crumb a{color:var(--accent);cursor:pointer;text-decoration:none}
  .crumb a:hover{text-decoration:underline}
  /* cards grid */
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  @media(max-width:780px){.g2,.g3{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:var(--radius);padding:22px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow)}
  .card .ic{font-size:30px;margin-bottom:10px}
  .card h3{font-size:17px;font-weight:800;margin-bottom:6px}
  .card p{font-size:13.5px;color:var(--muted)}
  .card .tag{position:absolute;top:16px;right:16px;font-size:11px;color:var(--muted);
    border:1px solid var(--line);padding:3px 9px;border-radius:99px}
  .lvl-b{color:var(--green)} .lvl-i{color:var(--gold)} .lvl-a{color:var(--red)}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;border:1px solid currentColor}
  .sec-title{font-size:22px;font-weight:800;margin:6px 0 4px;letter-spacing:-.4px}
  .sec-sub{color:var(--muted);font-size:14px;margin-bottom:20px}
  /* lesson reading view */
  .reader{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:var(--radius);padding:30px 32px}
  .reader h2{font-size:24px;font-weight:800;margin-bottom:4px;letter-spacing:-.5px}
  .reader .meta{color:var(--muted);font-size:13px;margin-bottom:22px}
  .lesson{margin-bottom:30px}
  .lesson h4{font-size:17px;font-weight:800;color:var(--accent2);margin:24px 0 8px;
    padding-left:11px;border-left:3px solid var(--accent2)}
  .lesson p{margin:9px 0;font-size:15px;color:#dde1ea}
  .lesson ul{margin:8px 0 8px 4px;list-style:none}
  .lesson li{padding:5px 0 5px 20px;position:relative;font-size:14.5px;color:#d4d9e3}
  .lesson li:before{content:"♪";position:absolute;left:0;color:var(--accent);font-size:13px}
  .tipbox{background:rgba(124,92,255,.08);border:1px solid rgba(124,92,255,.35);border-radius:12px;
    padding:14px 16px;margin:16px 0;font-size:14px}
  .tipbox b{color:var(--accent)}
  .exbox{background:rgba(55,194,160,.07);border:1px solid rgba(55,194,160,.3);border-radius:12px;
    padding:14px 16px;margin:16px 0;font-size:14px}
  table.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px}
  table.tbl th,table.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:center}
  table.tbl th{background:var(--panel2);color:var(--accent2)}
  .kbd{display:inline-block;background:#0c0e13;border:1px solid var(--line);border-radius:6px;
    padding:1px 7px;font-size:12.5px;color:var(--gold);font-family:monospace}
  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;
    padding:11px 20px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
  .btn:hover{filter:brightness(1.1)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .btn.ghost:hover{border-color:var(--accent)}
  .btn.sm{padding:7px 13px;font-size:13px;border-radius:9px}
  .btn.play{background:var(--accent2)}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  /* quiz */
  .quiz{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:var(--radius);padding:26px}
  .qprog{height:7px;background:#0c0e13;border-radius:99px;overflow:hidden;margin-bottom:18px}
  .qprog > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0;transition:.3s}
  .qnum{font-size:12.5px;color:var(--muted);margin-bottom:8px;font-weight:700}
  .qtext{font-size:18px;font-weight:700;margin-bottom:8px;line-height:1.5}
  .qaudio{display:flex;gap:10px;align-items:center;margin:14px 0 18px;flex-wrap:wrap}
  .choices{display:grid;gap:10px}
  .choice{text-align:left;background:var(--panel2);border:1.5px solid var(--line);color:var(--txt);
    padding:13px 16px;border-radius:11px;font-size:15px;cursor:pointer;transition:.12s}
  .choice:hover{border-color:var(--accent)}
  .choice.correct{border-color:var(--green);background:rgba(55,194,160,.13)}
  .choice.wrong{border-color:var(--red);background:rgba(239,90,120,.13)}
  .choice.dim{opacity:.5}
  .explain{margin-top:16px;background:rgba(78,161,255,.08);border:1px solid rgba(78,161,255,.32);
    border-radius:12px;padding:14px 16px;font-size:14px;display:none}
  .explain.show{display:block}
  .explain b{color:var(--blue)}
  /* score */
  .scorebox{text-align:center;padding:30px}
  .scorebox .big{font-size:54px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  /* stat pills on dashboard */
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}
  .pill{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;flex:1;min-width:130px}
  .pill .n{font-size:22px;font-weight:800}
  .pill .l{font-size:12px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px}
  .empty .ic{font-size:42px;opacity:.5;margin-bottom:10px}
  .footer{margin-top:40px;text-align:center;color:var(--muted);font-size:12px}
  .hidden{display:none!important}
  .fade{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .rw-item{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  .rw-item .qq{font-weight:700;font-size:15px;margin-bottom:6px}
  .rw-item .aa{font-size:13.5px;color:var(--muted)}
  .rw-item .aa b{color:var(--green)}
  select.lvlsel{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">🎼</div>
    <div class="brand">
      <h1>실용음악 화성학 · 시창청음 학습관</h1>
      <p>서울예술대학교 실용음악 입시 대비 · 화성학 & 시창청음</p>
    </div>
  </header>
  <nav class="crumb" id="crumb"></nav>
  <main id="view"></main>
  <div class="footer">© 실용음악 입시 학습관 · 단일 페이지 학습 앱 · 음 재생은 브라우저 Web Audio로 즉시 합성됩니다</div>
</div>

<script>
/* ============================================================
   AUDIO ENGINE  — Web Audio API 기반 음 합성 (별도 음원 불필요)
   ============================================================ */
const Audio = (()=>{
  let ctx=null;
  function ac(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume(); return ctx; }
  function midiToFreq(m){ return 440*Math.pow(2,(m-69)/12); }
  // 한 음 재생 (부드러운 피아노風 엔벨로프)
  function tone(midi, start, dur, vol=0.32){
    const c=ac(); const t0=c.currentTime+start;
    const osc=c.createOscillator(), g=c.createGain();
    osc.type='triangle'; osc.frequency.value=midiToFreq(midi);
    const osc2=c.createOscillator(), g2=c.createGain();
    osc2.type='sine'; osc2.frequency.value=midiToFreq(midi); // 배음 보강
    osc.connect(g); osc2.connect(g2); g.connect(c.destination); g2.connect(c.destination);
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    g2.gain.setValueAtTime(0,t0); g2.gain.linearRampToValueAtTime(vol*0.5,t0+0.02);
    g2.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.start(t0); osc.stop(t0+dur+0.05);
    osc2.start(t0); osc2.stop(t0+dur+0.05);
  }
  // 멜로디(차례로) — notes:[midi...]
  function melody(notes, noteDur=0.6){ notes.forEach((m,i)=> tone(m, i*noteDur, noteDur*0.95)); }
  // 화음(동시에)
  function chord(notes, dur=1.6){ notes.forEach(m=> tone(m,0,dur,0.26)); }
  // 음정: 화성(동시) 또는 가락(차례)
  function interval(notes, mode='harmonic'){
    if(mode==='harmonic') chord(notes,1.6); else melody(notes,0.7);
  }
  // 코드 진행 — chords:[[midi...],...]
  function progression(chords, dur=1.3){ chords.forEach((ch,i)=> ch.forEach(m=> tone(m,i*dur,dur*0.92,0.22))); }
  // 리듬(메트로놈 클릭) — pattern:[1,0,1,1...] 1=강,2=약, 0=쉼
  function rhythm(pattern, bpm=90){
    const c=ac(); const beat=60/bpm;
    pattern.forEach((v,i)=>{ if(v===0)return;
      const t0=c.currentTime+i*beat; const o=c.createOscillator(),g=c.createGain();
      o.type='square'; o.frequency.value=v===1?1400:900;
      o.connect(g); g.connect(c.destination);
      g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(0.25,t0+0.005);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.09);
      o.start(t0); o.stop(t0+0.1);
    });
  }
  function play(spec){
    if(!spec) return;
    switch(spec.type){
      case 'note': tone(spec.notes[0],0,1.2); break;
      case 'interval': interval(spec.notes, spec.mode||'harmonic'); break;
      case 'chord': chord(spec.notes, spec.dur||1.8); break;
      case 'melody': melody(spec.notes, spec.dur||0.6); break;
      case 'progression': progression(spec.notes, spec.dur||1.3); break;
      case 'rhythm': rhythm(spec.notes, spec.bpm||90); break;
      case 'scale': melody(spec.notes, spec.dur||0.42); break;
    }
  }
  return {play, tone};
})();

/* ============================================================
   안전 저장소 (오답정리/진도) — localStorage 실패 시 메모리 폴백
   ============================================================ */
const Store=(()=>{
  let mem={}; let ok=true;
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); }catch(e){ ok=false; }
  function get(k,d){ try{ if(ok){const v=localStorage.getItem(k);return v?JSON.parse(v):d;} }catch(e){} return (k in mem)?mem[k]:d; }
  function set(k,v){ try{ if(ok){localStorage.setItem(k,JSON.stringify(v));return;} }catch(e){} mem[k]=v; }
  return {get,set};
})();
const WRONG_KEY='ipsi_wrong_v1';
function loadWrong(){ return Store.get(WRONG_KEY,{}); }
function saveWrong(w){ Store.set(WRONG_KEY,w); }
function addWrong(subject, q){
  const w=loadWrong(); const k=subject; w[k]=w[k]||[];
  if(!w[k].some(x=>x.id===q.id)) w[k].push({id:q.id,q:q.q,ans:q.choices[q.answer],explain:q.explain,level:q._level,audio:q.audio||null});
  saveWrong(w);
}
function removeWrong(subject,id){ const w=loadWrong(); if(w[subject]) w[subject]=w[subject].filter(x=>x.id!==id); saveWrong(w); }

/* ============================================================
   데이터: 교육 콘텐츠 + 문제  (LESSONS / QUESTIONS)
   ============================================================ */
const LESSONS = {};   /* injected below */
const QUESTIONS = {};  /* injected below */

/* ============================================================
   라우팅 & 렌더링
   ============================================================ */
const SUBJECTS={ harmony:{name:'화성학',ic:'🎹'}, ear:{name:'시창청음',ic:'👂'} };
const CHAPTERS={ edu:{name:'교육',ic:'📖',desc:'개념을 차근차근 익히는 단원별 이론 학습'},
  practice:{name:'문제풀이',ic:'✏️',desc:'레벨별 문제로 실전 감각 키우기'},
  review:{name:'오답정리',ic:'🔁',desc:'틀린 문제만 모아 다시 점검'} };
const LEVELS=[ {k:'beginner',name:'초급',cls:'lvl-b'},{k:'intermediate',name:'중급',cls:'lvl-i'},{k:'advanced',name:'상급',cls:'lvl-a'} ];
const levelName=k=>({beginner:'초급',intermediate:'중급',advanced:'상급'}[k]||k);

const view=document.getElementById('view');
const crumbEl=document.getElementById('crumb');
let route={page:'home'};

function go(r){ if(window._pageCleanup){try{window._pageCleanup();}catch(e){} window._pageCleanup=null;} route=r; render(); window.scrollTo({top:0,behavior:'smooth'}); }
function crumb(parts){
  crumbEl.innerHTML = parts.map((p,i)=> i===parts.length-1
    ? `<b>${p.t}</b>` : `<a onclick='go(${JSON.stringify(p.r)})'>${p.t}</a> <span>›</span>`).join(' ');
}

function render(){
  if(route.page==='home') return renderHome();
  if(route.page==='subject') return renderSubject(route.subject);
  if(route.page==='edu-list') return renderEduList(route.subject);
  if(route.page==='edu') return renderEdu(route.subject, route.level);
  if(route.page==='practice-list') return renderPracticeList(route.subject);
  if(route.page==='quiz') return renderQuiz(route.subject, route.level);
  if(route.page==='review') return renderReview(route.subject);
  if(route.page==='dashboard') return renderDashboard();
  if(route.page==='sightsing') return renderSightSing();
  if(route.page==='tools') return renderTools();
}

function renderHome(){
  crumb([{t:'홈'}]);
  const w=loadWrong();
  const wc=Object.values(w).reduce((a,b)=>a+(b?b.length:0),0);
  const st=Stats.summary();
  view.innerHTML=`
  <div class="fade">
    <div class="sec-title">무엇을 공부할까요?</div>
    <div class="sec-sub">두 과목 모두 <b>교육 · 문제풀이 · 오답정리</b> 3개 챕터, 초급·중급·상급으로 구성되어 있습니다.</div>
    <div class="stats">
      <div class="pill"><div class="n" style="color:var(--gold)">🔥 ${st.streak}</div><div class="l">연속 학습일</div></div>
      <div class="pill"><div class="n">${st.totalQ}</div><div class="l">누적 푼 문항</div></div>
      <div class="pill"><div class="n" style="color:var(--green)">${st.acc}%</div><div class="l">전체 정답률</div></div>
      <div class="pill"><div class="n" style="color:var(--red)">${wc}</div><div class="l">내 오답 노트</div></div>
    </div>
    <div class="grid g2">
      ${Object.entries(SUBJECTS).map(([k,s])=>`
        <div class="card" onclick='go({page:"subject",subject:"${k}"})'>
          <div class="ic">${s.ic}</div>
          <h3>${s.name}</h3>
          <p>${k==='harmony'?'음정·스케일·화음·코드 진행까지, 음악의 뼈대를 세우는 이론':'듣고 적고 부르는 훈련 — 음정·화음·멜로디·리듬 청음과 시창'}</p>
        </div>`).join('')}
    </div>
    <div class="sec-title" style="margin-top:30px;font-size:18px">학습 도구</div>
    <div class="sec-sub">진도 확인과 실전 연습을 도와주는 보조 기능입니다.</div>
    <div class="grid g3">
      <div class="card" onclick='go({page:"dashboard"})'>
        <div class="ic">📊</div><h3>학습 대시보드</h3>
        <p>정답률 추이·약점 유형·연속 학습일을 한눈에</p></div>
      <div class="card" onclick='go({page:"sightsing"})'>
        <div class="ic">🎤</div><h3>시창 훈련</h3>
        <p>마이크로 노래하면 음정을 실시간으로 잡아줍니다</p></div>
      <div class="card" onclick='go({page:"tools"})'>
        <div class="ic">🛠️</div><h3>연습 도구</h3>
        <p>메트로놈 · 5도권 트레이너 · 자유 건반</p></div>
    </div>
  </div>`;
}
function countQ(){ let n=0; for(const s in QUESTIONS) for(const l in QUESTIONS[s]) n+=QUESTIONS[s][l].length; return n; }

function renderSubject(sub){
  const s=SUBJECTS[sub];
  crumb([{t:'홈',r:{page:'home'}},{t:s.name}]);
  view.innerHTML=`
  <div class="fade">
    <div class="sec-title">${s.ic} ${s.name} 대시보드</div>
    <div class="sec-sub">학습할 챕터를 선택하세요.</div>
    <div class="grid g3">
      <div class="card" onclick='go({page:"edu-list",subject:"${sub}"})'>
        <div class="ic">📖</div><h3>교육</h3><p>${CHAPTERS.edu.desc}</p></div>
      <div class="card" onclick='go({page:"practice-list",subject:"${sub}"})'>
        <div class="ic">✏️</div><h3>문제풀이</h3><p>${CHAPTERS.practice.desc}</p></div>
      <div class="card" onclick='go({page:"review",subject:"${sub}"})'>
        <div class="ic">🔁</div><h3>오답정리</h3><p>${CHAPTERS.review.desc}</p></div>
    </div>
  </div>`;
}

function renderEduList(sub){
  const s=SUBJECTS[sub];
  crumb([{t:'홈',r:{page:'home'}},{t:s.name,r:{page:'subject',subject:sub}},{t:'교육'}]);
  view.innerHTML=`<div class="fade">
    <div class="sec-title">📖 ${s.name} 교육</div>
    <div class="sec-sub">레벨을 선택하면 단원별 이론을 학습합니다.</div>
    <div class="grid g3">
      ${LEVELS.map(L=>{const cnt=(LESSONS[sub]&&LESSONS[sub][L.k]||[]).length;
        return `<div class="card" onclick='go({page:"edu",subject:"${sub}",level:"${L.k}"})'>
          <span class="tag">${cnt}개 단원</span>
          <div class="ic">${L.k==='beginner'?'🌱':L.k==='intermediate'?'🌳':'🏆'}</div>
          <h3 class="${L.cls}">${L.name}</h3>
          <p>${eduSub(sub,L.k)}</p></div>`}).join('')}
    </div></div>`;
}
function eduSub(sub,lv){

/* ---- Quiz state ---- */
let Q={list:[],idx:0,score:0,answered:false};
function renderQuiz(sub,lv){
  const s=SUBJECTS[sub];
  const list=buildSession(sub,lv,15).map(q=>({...q,_level:lv,_sub:sub}));
  crumb([{t:'홈',r:{page:'home'}},{t:s.name,r:{page:'subject',subject:sub}},
    {t:'문제풀이',r:{page:'practice-list',subject:sub}},{t:levelName(lv)}]);
  if(!list.length){ view.innerHTML=emptyMsg('아직 이 레벨의 문제가 없습니다.'); return; }
  Q={list,idx:0,score:0,answered:false,results:[]};
  drawQuestion(sub,lv);
}
function drawQuestion(sub,lv){
  const q=Q.list[Q.idx]; const total=Q.list.length;
  const pct=Math.round((Q.idx)/total*100);
  view.innerHTML=`<div class="fade quiz">
    <div class="qprog"><i style="width:${pct}%"></i></div>
    <div class="qnum">${SUBJECTS[sub].name} · ${levelName(lv)} · 문제 ${Q.idx+1} / ${total} · 점수 ${Q.score}</div>
    <div class="qtext">${q.q}</div>
    ${q.audio?`<div class="qaudio">
        <button class="btn play" onclick='playSpec(${JSON.stringify(q.audio)})'>▶ 소리 듣기</button>
        <span style="font-size:12.5px;color:var(--muted)">버튼을 눌러 여러 번 들어보세요</span></div>`:''}
    <div class="choices" id="choices">
      ${q.choices.map((c,i)=>`<button class="choice" onclick='answer(${i})'>${c}</button>`).join('')}
    </div>
    <div class="explain" id="explain"></div>
    <div class="btnrow" id="qbtns"></div>
  </div>`;
  // 오디오 문제는 진입 시 자동 1회 재생
  if(q.audio) setTimeout(()=>Audio.play(q.audio),350);
}
function answer(i){
  if(Q.answered) return; Q.answered=true;
  const q=Q.list[Q.idx]; const sub=q._sub;
  const btns=[...document.querySelectorAll('#choices .choice')];
  btns.forEach((b,j)=>{ b.onclick=null;
    if(j===q.answer) b.classList.add('correct');
    else if(j===i) b.classList.add('wrong'); else b.classList.add('dim'); });
  const ex=document.getElementById('explain');
  const correct=(i===q.answer);
  if(correct){ Q.score++; ex.innerHTML=`<b>정답입니다! ✔</b> ${q.explain}`; }
  else { ex.innerHTML=`<b>오답입니다.</b> 정답은 <b>${q.choices[q.answer]}</b> 입니다. ${q.explain}`;
    addWrong(sub,q); }
  (Q.results=Q.results||[]).push({sig:q.sig||q.id||'',correct});
  ex.classList.add('show');
  const last=Q.idx===Q.list.length-1;
  document.getElementById('qbtns').innerHTML= last
    ? `<button class="btn" onclick='finishQuiz()'>결과 보기 →</button>`
    : `<button class="btn" onclick='nextQ()'>다음 문제 →</button>`;
}
function nextQ(){ Q.idx++; Q.answered=false; const q=Q.list[Q.idx]; drawQuestion(q._sub,q._level); }
function finishQuiz(){
  const sub=Q.list[0]._sub, lv=Q.list[0]._level; const total=Q.list.length;
  const pct=Math.round(Q.score/total*100);
  Stats.record(sub,lv,Q.score,total,Q.results||[]);
  const msg = pct>=90?'완벽합니다! 입시 실전에서도 통할 실력이에요.':pct>=70?'좋아요! 틀린 부분만 오답정리에서 마무리하면 됩니다.':pct>=50?'기초는 잡혔어요. 교육 단원을 한 번 더 복습해 봅시다.':'괜찮아요. 교육 단원부터 차근차근 다시 다져봐요.';
  view.innerHTML=`<div class="fade quiz scorebox">
    <div class="big">${Q.score} / ${total}</div>
    <div style="font-size:17px;font-weight:700;margin:8px 0">정답률 ${pct}%</div>
    <p style="color:var(--muted);max-width:440px;margin:6px auto 0">${msg}</p>
    <div class="btnrow" style="justify-content:center">
      <button class="btn" onclick='go({page:"quiz",subject:"${sub}",level:"${lv}"})'>다시 풀기</button>
      <button class="btn ghost" onclick='go({page:"review",subject:"${sub}"})'>오답정리 보기</button>
      <button class="btn ghost" onclick='go({page:"practice-list",subject:"${sub}"})'>레벨 선택</button>
    </div>
  </div>`;
}

function renderReview(sub){
  const s=SUBJECTS[sub];
  crumb([{t:'홈',r:{page:'home'}},{t:s.name,r:{page:'subject',subject:sub}},{t:'오답정리'}]);
  const w=loadWrong(); const items=w[sub]||[];
  if(!items.length){ view.innerHTML=`<div class="fade">
    <div class="sec-title">🔁 ${s.name} 오답정리</div>
    ${emptyMsg('아직 틀린 문제가 없습니다. 문제풀이에서 푼 문제 중 틀린 것이 여기에 모입니다.')}
    <div style="text-align:center"><button class="btn" onclick='go({page:"practice-list",subject:"${sub}"})'>문제 풀러 가기</button></div>
    </div>`; return; }
  view.innerHTML=`<div class="fade">
    <div class="sec-title">🔁 ${s.name} 오답정리</div>
    <div class="sec-sub">틀린 문제 ${items.length}개 · 다시 확인하고 해결하면 목록에서 지울 수 있습니다.</div>
    ${items.map(it=>`<div class="rw-item">
      <div class="qq">[${levelName(it.level)}] ${it.q}</div>
      ${it.audio?`<div class="btnrow"><button class="btn play sm" onclick='playSpec(${JSON.stringify(it.audio)})'>▶ 소리 다시 듣기</button></div>`:''}
      <div class="aa">정답: <b>${it.ans}</b><br>${it.explain}</div>
      <div class="btnrow"><button class="btn ghost sm" onclick='clearOne("${sub}","${it.id}")'>해결함 ✓ (목록에서 제거)</button></div>
    </div>`).join('')}
    <div class="btnrow"><button class="btn ghost sm" onclick='clearAll("${sub}")'>전체 비우기</button></div>
  </div>`;
}
function clearOne(sub,id){ removeWrong(sub,id); renderReview(sub); }
function clearAll(sub){ const w=loadWrong(); w[sub]=[]; saveWrong(w); renderReview(sub); }

function emptyMsg(t){ return `<div class="empty"><div class="ic">🗒️</div>${t}</div>`; }

</script>

    <tr><td>maj7</td><td>C E G B</td><td>밝고 세련됨</td></tr>
    <tr><td>m7</td><td>C E♭ G B♭</td><td>부드럽고 어두움</td></tr>
    <tr><td>7 (dominant)</td><td>C E G B♭</td><td>긴장·해결 욕구</td></tr>
    <tr><td>m7♭5</td><td>C E♭ G♭ B♭</td><td>반감7, 불안정</td></tr>
    <tr><td>dim7</td><td>C E♭ G♭ B♭♭</td><td>강한 긴장</td></tr></table>
    <div class="exbox"><b>🍀 쉽게 말하면.</b> 7화음은 '3화음(음 3개) 위에 음 하나를 더 얹은 것'이에요. 음이 늘수록 소리가 더 풍부하고 어른스러워집니다. 실용음악·재즈가 3화음보다 7화음을 즐겨 쓰는 이유죠.</div>
    <div class="tipbox"><b>도미넌트7의 비밀.</b> 7화음 안의 3음과 7음이 만드는 <b>증4도(트라이톤)</b>가 해결을 향한 긴장의 원천입니다.</div>`,
   audio:[{label:'Cmaj7',spec:{type:'chord',notes:[60,64,67,71]}},{label:'Cm7',spec:{type:'chord',notes:[60,63,67,70]}},{label:'C7',spec:{type:'chord',notes:[60,64,67,70]}}]},
  {title:'다이아토닉 코드(Diatonic Chords)', body:`
    <p>한 조성의 음계 음만으로 차례차례 7화음을 쌓으면, 그 조에 '소속된' 일곱 개의 코드가 만들어집니다. 이를 <b>다이아토닉 코드</b>라 합니다. 다장조의 경우는 다음과 같습니다.</p>
    <table class="tbl"><tr><th>도수</th><td>I</td><td>ii</td><td>iii</td><td>IV</td><td>V</td><td>vi</td><td>vii°</td></tr>
    <tr><th>코드</th><td>Cmaj7</td><td>Dm7</td><td>Em7</td><td>Fmaj7</td><td>G7</td><td>Am7</td><td>Bm7♭5</td></tr></table>
    <p>이 표는 모든 장조에서 같은 패턴(maj7 · m7 · m7 · maj7 · 7 · m7 · m7♭5)으로 반복됩니다. 곡의 코드를 보면 어느 조에 속하는지 역으로 추적할 수 있어, 작곡과 분석의 출발점이 됩니다.</p>
    <div class="exbox"><b>🍀 쉽게 말하면.</b> 한 조성에는 '함께 어울려 쓰는 코드 7개'가 정해져 있어요. 그 7개가 다이아토닉 코드이고, 대부분의 노래는 이 안에서 코드가 돕니다.</div>
    <div class="exbox"><b>입시 포인트.</b> 장조의 다이아토닉 패턴은 반드시 암기하세요. V7은 도미넌트, I은 으뜸이라는 사실이 다음 단원의 기초가 됩니다.</div>`,
   audio:[{label:'다이아토닉 진행 듣기',spec:{type:'progression',notes:[[60,64,67,71],[62,65,69,72],[67,71,74,77],[60,64,67,71]],dur:1.2}}]},
  {title:'모드(교회선법) — 음계의 일곱 가지 표정', body:`
    <p>같은 음 일곱 개라도 <b>어느 음을 '도'(중심)로 삼느냐</b>에 따라 분위기가 완전히 달라집니다. 장음계의 시작 음을 한 칸씩 옮겨 만든 일곱 가지 음계를 <b>모드(Mode)</b>, 우리말로 <b>교회선법</b>이라 합니다.</p>
    <table class="tbl"><tr><th>모드</th><th>시작음(다장조 기준)</th><th>분위기</th><th>어울리는 코드</th></tr>
    <tr><td>Ionian (이오니안)</td><td>도</td><td>밝은 장조 (=장음계)</td><td>maj7</td></tr>
    <tr><td>Dorian (도리안)</td><td>레</td><td>세련된 단조</td><td>m7</td></tr>
    <tr><td>Phrygian (프리지안)</td><td>미</td><td>어둡고 이국적</td><td>m7</td></tr>
    <tr><td>Lydian (리디안)</td><td>파</td><td>몽환적인 장조</td><td>maj7(♯11)</td></tr>
    <tr><td>Mixolydian (믹솔리디안)</td><td>솔</td><td>블루지한 장조</td><td>7</td></tr>
    <tr><td>Aeolian (에올리안)</td><td>라</td><td>슬픈 단조 (=자연단음계)</td><td>m7</td></tr>
    <tr><td>Locrian (로크리안)</td><td>시</td><td>불안정</td><td>m7♭5</td></tr></table>
    <p>실용음악에서 특히 자주 쓰이는 모드는 <b>도리안</b>(세련된 단조), <b>믹솔리디안</b>(블루지한 장조), <b>리디안</b>(붕 뜬 듯 몽환적인 장조)입니다. 솔로·애드리브의 음 선택이 바로 이 모드에서 나옵니다.</p>
    <div class="exbox"><b>🍀 쉽게 말하면.</b> 흰건반(도레미파솔라시)은 그대로인데, 어느 음을 '집'으로 삼느냐만 바꾸는 거예요. 집을 '레'로 옮기면 도리안, '솔'로 옮기면 믹솔리디안 — 같은 재료로 일곱 가지 표정을 만드는 셈입니다.</div>
    <div class="tipbox"><b>핵심.</b> 아래 버튼은 모두 '도(C)에서 시작'하도록 맞춰 두었습니다. 시작음을 같게 두고 들어야 모드마다의 색깔 차이가 또렷이 들립니다.</div>`,
   audio:[{label:'이오니안',spec:{type:'scale',notes:[60,62,64,65,67,69,71,72],dur:0.4}},{label:'도리안',spec:{type:'scale',notes:[60,62,63,65,67,69,70,72],dur:0.4}},{label:'프리지안',spec:{type:'scale',notes:[60,61,63,65,67,68,70,72],dur:0.4}},{label:'리디안',spec:{type:'scale',notes:[60,62,64,66,67,69,71,72],dur:0.4}},{label:'믹솔리디안',spec:{type:'scale',notes:[60,62,64,65,67,69,70,72],dur:0.4}},{label:'에올리안',spec:{type:'scale',notes:[60,62,63,65,67,68,70,72],dur:0.4}},{label:'로크리안',spec:{type:'scale',notes:[60,61,63,65,66,68,70,72],dur:0.4}}]},
  {title:'코드의 기능 — T·S·D', body:`
    <p>다이아토닉 코드는 각자 역할이 있습니다. 이를 <b>기능(Function)</b>이라 하며 세 가지로 묶습니다.</p>
    <ul>
      <li><b>토닉(Tonic, T)</b> — I, vi : 안정·귀결의 자리</li>
      <li><b>서브도미넌트(Subdominant, S)</b> — IV, ii : 변화·이탈의 자리</li>
      <li><b>도미넌트(Dominant, D)</b> — V, vii° : 긴장·해결 욕구의 자리</li>
    </ul>
    <p>음악은 대체로 <b>T → S → D → T</b>의 흐름으로 긴장을 쌓았다가 풀어냅니다. 다장조의 대표 진행 <b>C → F → G7 → C</b>가 바로 이 원리입니다. 같은 기능끼리는 서로 대체할 수 있어, ii가 IV를 대신하거나 vi가 I을 대신하기도 합니다.</p>
    <div class="exbox"><b>🍀 쉽게 말하면.</b> 코드마다 '역할'이 있어요. 토닉은 편안한 '집', 도미넌트는 집에 가고 싶은 '긴장', 서브도미넌트는 그 사이의 '길목'입니다. 집을 나섰다가 다시 돌아오는 이야기가 곧 코드 진행이에요.</div>
    <div class="tipbox"><b>핵심.</b> 코드를 '이름'이 아니라 '기능'으로 읽는 순간, 모든 곡의 구조가 보이기 시작합니다.</div>`,
   audio:[{label:'T–S–D–T (C–F–G7–C)',spec:{type:'progression',notes:[[60,64,67],[65,69,72],[67,71,74,77],[60,64,67]],dur:1.3}}]},
  {title:'자리바꿈(Inversion)과 슬래시 코드', body:`
    <p>화음의 근음이 항상 맨 아래에 있어야 하는 것은 아닙니다. 3음이나 5음을 가장 낮은 자리에 두는 것을 <b>자리바꿈</b>이라 합니다.</p>
    <ul>
      <li><b>기본위치</b> — 근음이 베이스 (C : 도–미–솔)</li>
      <li><b>1전위</b> — 3음이 베이스 (C/E : 미–솔–도)</li>
      <li><b>2전위</b> — 5음이 베이스 (C/G : 솔–도–미)</li>
    </ul>
    <p>실용음악에서는 <span class="kbd">C/E</span> 처럼 '코드/베이스음' 형태의 <b>슬래시 코드</b>로 표기합니다. 자리바꿈은 베이스 라인을 부드럽게 이어 주는 핵심 기법으로, 같은 코드라도 베이스의 움직임에 따라 전혀 다른 인상을 줍니다.</p>
    <div class="exbox"><b>🍀 쉽게 말하면.</b> 같은 화음에서 '맨 아래 음(베이스)'만 누가 맡을지 바꾼 거예요. 멤버는 그대로인데 줄 세우는 순서만 바꾼 셈이라, 베이스 라인이 한결 부드럽게 이어집니다.</div>`,
   audio:[{label:'C 기본 → C/E → C/G',spec:{type:'progression',notes:[[48,60,64,67],[52,60,67,72],[55,60,64,72]],dur:1.3}}]}
 ],
 advanced:[
  {title:'텐션(Tension) — 화음의 색채', body:`
    <p>7화음 위에 9·11·13도를 더 쌓은 음을 <b>텐션</b>이라 합니다. 코드의 기본 골격(근음·3음·5음·7음)은 유지하면서 그 위에 색을 입히는 음입니다.</p>
    <ul>
      <li>9도 = 근음 + 장2도 (옥타브 위)</li>
      <li>11도 = 근음 + 완전4도 (옥타브 위)</li>
      <li>13도 = 근음 + 장6도 (옥타브 위)</li>
    </ul>
    <p>다만 코드 톤과 반음으로 부딪치는 텐션은 피합니다. 예를 들어 maj7 코드에서 11도는 3음과 반음 충돌을 일으켜 <b>어보이드 노트</b>가 됩니다. 그래서 Cmaj7의 어울리는 텐션은 9와 13입니다.</p>
    <div class="exbox"><b>🍀 쉽게 말하면.</b> 텐션은 기본 화음 위에 뿌리는 '양념'이에요. 코드 톤에서 한 칸(온음) 떨어진 자리에 넣으면 소리가 세련돼지고, 반음으로 바짝 붙이면 맛이 탁해져 피합니다.</div>
    <div class="tipbox"><b>정리.</b> 텐션은 코드 톤에서 장2도(온음) 위에 있는 음이 잘 어울립니다. 반음으로 바짝 붙으면 부딪치니 피하세요.</div>`,
   audio:[{label:'Cmaj9 듣기',spec:{type:'chord',notes:[60,64,67,71,74]}}]},
  {title:'세컨더리 도미넌트(Secondary Dominant)', body:`
    <p>도미넌트(V7)는 으뜸으로 가려는 강한 힘을 갖습니다. 이 원리를 빌려, <b>으뜸이 아닌 다른 다이아토닉 코드</b>를 잠시 으뜸처럼 대접하고 그 앞에 도미넌트를 놓는 기법이 세컨더리 도미넌트입니다.</p>
    <p>다장조에서 V(G)로 가기 전에, G를 잠깐 으뜸으로 보고 그 도미넌트인 <b>D7</b>을 넣습니다. 이를 <b>V7/V</b>(파이브 오브 파이브)라 부릅니다.</p>
    <table class="tbl"><tr><th>표기</th><td>V7/ii</td><td>V7/iii</td><td>V7/IV</td><td>V7/V</td><td>V7/vi</td></tr>
    <tr><th>다장조</th><td>A7</td><td>B7</td><td>C7</td><td>D7</td><td>E7</td></tr></table>
    <p>세컨더리 도미넌트는 조를 벗어나지 않으면서도 일시적인 긴장과 화려함을 더해 줍니다.</p>
    <div class="exbox"><b>🍀 쉽게 말하면.</b> 도미넌트(V7)는 '다음 코드로 끌어당기는 자석'이에요. 그 자석을 으뜸이 아닌 다른 코드 앞에도 잠깐 갖다 붙여, 목적지 코드로 더 강하게 끌어주는 기법입니다.</div>`,
   audio:[{label:'D7(V/V) → G7 → C',spec:{type:'progression',notes:[[62,66,69,72],[67,71,74,77],[60,64,67,71]],dur:1.3}}]},
  {title:'모달 인터체인지(Modal Interchange)', body:`
    <p>같은 으뜸음을 공유하는 다른 조(주로 동주단조)에서 코드를 잠시 빌려오는 기법을 <b>모달 인터체인지</b> 또는 차용화음이라 합니다. 장조 곡에 단조의 그늘진 색채를 더할 수 있습니다.</p>
    <p>다장조가 다단조(C minor)에서 자주 빌려오는 코드는 다음과 같습니다.</p>
    <ul>
      <li><b>iv</b> (Fm) — IV를 단화음으로, 애틋한 마무리</li>
      <li><b>♭VII</b> (B♭) — 팝·록에서 흔한 시원한 진행</li>
      <li><b>♭VI</b> (A♭), <b>♭III</b> (E♭) — 극적인 전환</li>
    </ul>
    <div class="tipbox"><b>⚠ 이름 주의.</b> 바로 앞 단원의 <b>모드(교회선법)</b>와 헷갈리기 쉽습니다. <b>모드</b>는 '음계의 종류'이고, <b>모달 인터체인지</b>는 '다른 조에서 코드를 빌려오는 기법'입니다. 이름만 닮았을 뿐 서로 다른 개념이에요.</div>
    <div class="exbox"><b>🍀 쉽게 말하면.</b> 밝은 장조 노래에 단조의 코드를 잠깐 '빌려 끼우는' 거예요. 익숙한 길에 살짝 그늘을 드리워, 같은 진행도 더 애틋하게 들리게 만듭니다.</div>
    <div class="exbox"><b>대표 사운드.</b> C – G – Fm – C. 마지막의 Fm(iv)이 주는 '아련함'이 모달 인터체인지의 매력입니다.</div>`,
   audio:[{label:'C – G – Fm – C',spec:{type:'progression',notes:[[60,64,67],[67,71,74],[65,68,72],[60,64,67]],dur:1.3}}]},
  {title:'II–V–I 와 리하모니제이션', body:`
    <p><b>II–V–I</b>는 실용음악·재즈의 가장 기본이 되는 진행입니다. 서브도미넌트(ii) → 도미넌트(V) → 토닉(I)으로 이어지며, 긴장이 자연스럽게 해결됩니다. 다장조에서는 <b>Dm7 – G7 – Cmaj7</b> 입니다.</p>
    <p>이 진행을 변형해 더 풍부하게 만드는 작업이 <b>리하모니제이션</b>입니다. 대표적인 방법은 다음과 같습니다.</p>
    <ul>
      <li><b>트라이톤 대리</b> — G7을 같은 트라이톤을 가진 D♭7로 교체 (Dm7 – D♭7 – Cmaj7)</li>
      <li><b>세컨더리 도미넌트 삽입</b> — 목표 코드 앞에 임시 도미넌트 추가</li>
      <li><b>대리 코드</b> — 같은 기능의 다이아토닉 코드로 치환</li>
    </ul>
    <div class="exbox"><b>🍀 쉽게 말하면.</b> II–V–I은 '준비 → 긴장 → 해결'의 3박자 공식이에요. 재즈·발라드·팝 어디서나 곡을 매듭짓는 자리에 등장하는, 가장 많이 쓰이는 코드 흐름입니다.</div>
    <div class="tipbox"><b>입시 마무리.</b> II–V–I를 12개 조 모두에서 즉시 떠올릴 수 있으면 화성학의 큰 산을 넘은 것입니다.</div>`,
   audio:[{label:'II–V–I (Dm7–G7–Cmaj7)',spec:{type:'progression',notes:[[62,65,69,72],[67,71,74,77],[60,64,67,71]],dur:1.3}},{label:'트라이톤 대리',spec:{type:'progression',notes:[[62,65,69,72],[61,65,68,71],[60,64,67,71]],dur:1.3}}]}
 ]
},
ear:{
 beginner:[
  {title:'음정 듣기 — 귀로 거리 재기', body:`
    <p>시창청음의 첫걸음은 두 음 사이의 거리를 귀로 알아맞히는 것입니다. 음정은 두 음을 <b>동시에</b> 들려주는 화성 음정과, <b>차례로</b> 들려주는 가락 음정이 있습니다.</p>
    <p>처음에는 익숙한 노래의 첫 두 음으로 음정을 외우면 좋습니다.</p>
    <ul>
      <li>완전4도 — '결혼 행진곡' 첫 두 음</li>
      <li>완전5도 — '반짝반짝 작은별' 도–솔</li>
      <li>장3도 — '도–미'의 밝은 느낌</li>
      <li>옥타브 — 'Somewhere over the rainbow'</li>
    </ul>
    <div class="tipbox"><b>훈련법.</b> 아래 버튼으로 음정을 듣고, 머릿속으로 도수를 떠올린 뒤 직접 따라 불러 보세요.</div>`,
   audio:[{label:'완전5도',spec:{type:'interval',notes:[60,67]}},{label:'완전4도',spec:{type:'interval',notes:[60,65]}},{label:'장3도',spec:{type:'interval',notes:[60,64]}},{label:'옥타브',spec:{type:'interval',notes:[60,72]}}]},
  {title:'단음 청음 — 으뜸음 잡기', body:`
    <p>단음 청음은 들려주는 한 음이 음계의 몇 번째 음인지 알아맞히는 훈련입니다. 핵심은 <b>으뜸음(도)</b>을 기준점으로 단단히 잡는 것입니다.</p>
    <p>먼저 으뜸음을 듣고 머릿속에 '도'를 고정한 다음, 들려주는 음이 그보다 위인지 아래인지, 몇 도 떨어졌는지 가늠합니다. 도–미–솔(으뜸화음 음)부터 정확히 잡으면 나머지 음은 그 사이에서 찾을 수 있습니다.</p>
    <div class="exbox"><b>순서.</b> ① 으뜸음 듣기 → ② 도·미·솔 떠올리기 → ③ 들린 음을 그 안에 위치시키기.</div>`,
   audio:[{label:'으뜸음(도)',spec:{type:'note',notes:[60]}},{label:'도–미–솔',spec:{type:'melody',notes:[60,64,67],dur:0.5}}]},
  {title:'기본 리듬 — 박과 음표 길이', body:`
    <p>리듬 청음의 토대는 <b>박(beat)</b>을 일정하게 느끼는 것입니다. 4/4박자는 한 마디에 4분음표가 네 개 들어가는 가장 흔한 박자입니다.</p>
    <table class="tbl"><tr><th>음표</th><td>온음표</td><td>2분음표</td><td>4분음표</td><td>8분음표</td></tr>
    <tr><th>길이(4/4)</th><td>4박</td><td>2박</td><td>1박</td><td>½박</td></tr></table>
    <p>먼저 발로 박을 밟으면서 손뼉으로 리듬을 치는 연습을 합니다. 박은 변하지 않는 '바닥', 리듬은 그 위에서 움직이는 '발걸음'이라고 생각하면 쉽습니다.</p>`,
   audio:[{label:'4분음표 4개',spec:{type:'rhythm',notes:[1,2,2,2],bpm:90}},{label:'8분음표 섞기',spec:{type:'rhythm',notes:[1,2,2,2,1,2,2,2],bpm:120}}]},
  {title:'메이저 스케일 시창', body:`
    <p>시창은 악보를 보고 계이름으로 노래하는 것입니다. 가장 먼저 장음계를 정확한 음정으로 오르내리는 연습부터 시작합니다.</p>
    <p>도–레–미–파–솔–라–시–도. 이때 <b>미–파</b>와 <b>시–도</b>가 반음이라는 점을 몸으로 느끼는 것이 중요합니다. 반음 구간을 좁게, 온음 구간을 넉넉하게 부르는 감각을 길러야 음정이 흔들리지 않습니다.</p>
    <div class="tipbox"><b>연습법.</b> 음원을 한 번 듣고, 소리를 끄고 스스로 부른 뒤, 다시 들으며 음정을 점검하세요.</div>`,
   audio:[{label:'장음계 상행',spec:{type:'scale',notes:[60,62,64,65,67,69,71,72],dur:0.45}},{label:'장음계 하행',spec:{type:'scale',notes:[72,71,69,67,65,64,62,60],dur:0.45}}]}
 ],
 intermediate:[
  {title:'3화음 청음 — 색깔 구별', body:`
    <p>화음 청음은 동시에 울린 화음의 종류를 알아맞히는 훈련입니다. 3화음 단계에서는 네 가지 색을 분명히 구별할 수 있어야 합니다.</p>
    <ul>
      <li><b>장3화음</b> — 밝고 안정적, '활짝 핀' 느낌</li>
      <li><b>단3화음</b> — 어둡고 차분한 느낌</li>
      <li><b>감3화음</b> — 조이는 듯한 긴장</li>
      <li><b>증3화음</b> — 붕 뜬 듯 불안정</li>
    </ul>
    <p>장·단의 차이는 <b>3음</b>이 결정합니다. 가장 아래 음과 가운데 음 사이가 넓으면(장3도) 밝고, 좁으면(단3도) 어둡습니다.</p>`,
   audio:[{label:'장3화음',spec:{type:'chord',notes:[60,64,67]}},{label:'단3화음',spec:{type:'chord',notes:[60,63,67]}},{label:'감3화음',spec:{type:'chord',notes:[60,63,66]}},{label:'증3화음',spec:{type:'chord',notes:[60,64,68]}}]},
  {title:'다이아토닉 코드 청음', body:`
    <p>한 조성 안에서 코드가 바뀌는 흐름을 듣고 그 <b>기능</b>을 느끼는 훈련입니다. 토닉(안정) → 도미넌트(긴장) → 토닉(해결)의 흐름이 귀에 들어오기 시작하면 코드 청음의 절반은 완성된 것입니다.</p>
    <p>특히 <b>V7 → I</b>의 해결감을 정확히 포착하는 것이 중요합니다. 도미넌트의 긴장이 으뜸으로 '풀리는' 순간의 소리를 외우세요.</p>
    <div class="exbox"><b>듣기 순서.</b> ① 베이스(가장 낮은 음)의 움직임 → ② 코드의 밝고 어두움 → ③ 긴장과 해결의 위치.</div>`,
   audio:[{label:'I–IV–V7–I',spec:{type:'progression',notes:[[60,64,67],[65,69,72],[67,71,74,77],[60,64,67]],dur:1.2}}]},
  {title:'짧은 멜로디 청음 (2~4마디)', body:`
    <p>멜로디 청음은 들려주는 가락을 음정과 리듬으로 받아 적는 종합 훈련입니다. 한 번에 모두 적으려 하지 말고 단계로 나눕니다.</p>
    <ul>
      <li>1단계 — 전체를 들으며 <b>윤곽</b>(오르내림)을 파악</li>
      <li>2단계 — <b>리듬</b>부터 받아 적기</li>
      <li>3단계 — 시작음과 으뜸화음 음을 기준으로 <b>음높이</b> 채우기</li>
    </ul>
    <p>아래 멜로디를 듣고 계이름으로 받아 적어 본 뒤, 다시 들으며 확인해 보세요.</p>`,
   audio:[{label:'멜로디 예시 ①',spec:{type:'melody',notes:[60,62,64,65,64,62,60],dur:0.5}},{label:'멜로디 예시 ②',spec:{type:'melody',notes:[64,67,65,64,62,60],dur:0.5}}]},
  {title:'싱코페이션 리듬', body:`
    <p><b>싱코페이션</b>은 강박이 아닌 여린박에 강세가 오는 리듬으로, 실용음악 특유의 '그루브'를 만듭니다. 박을 정확히 느끼는 상태에서 그 사이(엇박)를 강조하는 것이 핵심입니다.</p>
    <p>대표적으로 8분음표가 박을 넘어 묶이는 형태(예: 점4분–8분)가 자주 나옵니다. 박은 발로 일정하게 유지하면서, 손으로 엇박을 치는 분리 훈련을 반복하세요.</p>
    <div class="tipbox"><b>주의.</b> 싱코페이션을 들을 때 박을 놓치면 리듬 전체가 흔들립니다. 항상 속으로 박을 세며 들으세요.</div>`,
   audio:[{label:'정박 리듬',spec:{type:'rhythm',notes:[1,2,1,2,1,2,1,2],bpm:100}},{label:'싱코페이션',spec:{type:'rhythm',notes:[1,0,2,1,0,2,1,2],bpm:100}}]}
 ],
 advanced:[
  {title:'7화음·텐션 청음', body:`
    <p>상급 화음 청음은 7화음과 텐션의 색을 구별합니다. 3화음 위에 얹힌 <b>7음</b>의 성격을 먼저 듣는 것이 요령입니다.</p>
    <ul>
      <li><b>maj7</b> — 7음이 으뜸 바로 아래(반음)에서 빛나는 세련된 소리</li>
      <li><b>7(dominant)</b> — 트라이톤의 긴장이 느껴지는 소리</li>
      <li><b>m7</b> — 어둡지만 부드럽게 풀린 소리</li>
      <li><b>m7♭5</b> — 더 조이고 불안정한 소리</li>
    </ul>
    <p>텐션이 들어가면 화음이 더 '넓고 흐릿하게' 퍼집니다. 9도의 영롱함, 13도의 트인 느낌을 색으로 기억하세요.</p>`,
   audio:[{label:'maj7',spec:{type:'chord',notes:[60,64,67,71]}},{label:'dominant7',spec:{type:'chord',notes:[60,64,67,70]}},{label:'m7',spec:{type:'chord',notes:[60,63,67,70]}},{label:'maj9',spec:{type:'chord',notes:[60,64,67,71,74]}}]},
  {title:'코드 진행 청음', body:`
    <p>여러 코드가 이어지는 진행을 듣고 그 흐름을 적어내는 훈련입니다. 개별 코드를 하나씩 맞히려 하기보다 <b>기능의 흐름</b>으로 듣는 것이 빠르고 정확합니다.</p>
    <p>가장 먼저 익혀야 할 것은 <b>II–V–I</b>입니다. ii의 차분함, V7의 긴장, I의 해결이 한 덩어리로 들리도록 반복해 들으세요. 여기에 세컨더리 도미넌트나 트라이톤 대리가 끼면 어느 지점에서 '예상과 다른 색'이 나는지 포착합니다.</p>
    <div class="exbox"><b>듣기 전략.</b> 베이스 라인을 먼저 따라 적으면 코드 진행의 골격이 거의 드러납니다.</div>`,
   audio:[{label:'II–V–I',spec:{type:'progression',notes:[[62,65,69,72],[67,71,74,77],[60,64,67,71]],dur:1.3}},{label:'I–vi–ii–V',spec:{type:'progression',notes:[[60,64,67,71],[57,60,64,67],[62,65,69,72],[67,71,74,77]],dur:1.2}}]},
  {title:'조옮김 멜로디', body:`
    <p>상급 시창에서는 다장조가 아닌 다른 조의 멜로디를 정확히 불러야 합니다. 핵심은 음이름이 아니라 <b>계이름(이동도법)</b>으로 사고하는 것입니다. 어느 조든 으뜸음을 '도'로 잡으면 음정 관계는 동일합니다.</p>
    <p>먼저 그 조의 으뜸음과 으뜸화음을 듣고 조성을 몸에 새긴 뒤, 평소 다장조에서 익힌 계이름 감각을 그대로 옮겨 적용합니다. 조표(♯·♭)의 위치를 외워 두면 조옮김이 한결 수월합니다.</p>`,
   audio:[{label:'사장조 멜로디',spec:{type:'melody',notes:[67,69,71,72,71,69,67],dur:0.5}},{label:'바장조 멜로디',spec:{type:'melody',notes:[65,67,69,70,69,67,65],dur:0.5}}]},
  {title:'복합 리듬', body:`
    <p>상급 리듬 청음은 16분음표, 셋잇단음표, 붙임줄과 쉼표가 얽힌 복합 리듬을 다룹니다. 빠른 음표일수록 박의 균등한 분할이 흔들리기 쉬우므로, <b>박을 더 잘게 쪼개 세는</b> 습관이 필요합니다.</p>
    <ul>
      <li>4분음표를 16분음표 4개로 쪼개 '1–e–&–a'로 세기</li>
      <li>셋잇단음표는 한 박을 정확히 3등분</li>
      <li>붙임줄·쉼표는 '소리 없는 박'까지 정확히 유지</li>
    </ul>
    <div class="tipbox"><b>마무리.</b> 복합 리듬도 결국 일정한 박 위에서 움직입니다. 박을 잃지 않는 한 어떤 리듬도 받아 적을 수 있습니다.</div>`,
   audio:[{label:'16분음표 리듬',spec:{type:'rhythm',notes:[1,2,2,2,1,2,2,2,1,2,2,2,1,2,2,2],bpm:140}},{label:'셋잇단 느낌',spec:{type:'rhythm',notes:[1,2,2,1,2,2,1,2,2,1,2,2],bpm:150}}]}
 ]
}

/* ============================================================

const _rnd=a=>a[Math.floor(Math.random()*a.length)];
const _rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const _shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function _pick(correct,pool,n=4){const s=[correct];for(const x of _shuf(pool)){if(s.length>=n)break;if(!s.includes(x))s.push(x);}const ch=_shuf(s);return{choices:ch,answer:ch.indexOf(correct)};}

 const nm=o=>o.l+(o.a>0?'♯'.repeat(o.a):o.a<0?'♭'.repeat(-o.a):'');

 function MXU_pc(o){return(((LS[o.l]+o.a)%12)+12)%12;}
 return{parse,pc,nm,above};})();

const INTV=[{n:'단2도',d:2,s:1},{n:'장2도',d:2,s:2},{n:'단3도',d:3,s:3},{n:'장3도',d:3,s:4},{n:'완전4도',d:4,s:5},{n:'완전5도',d:5,s:7},{n:'단6도',d:6,s:8},{n:'장6도',d:6,s:9},{n:'단7도',d:7,s:10},{n:'장7도',d:7,s:11},{n:'옥타브',d:8,s:12}];

   ()=>{const root=_rnd(ROOTS);const r=MXU.parse(root);const third=_nn(MXU.above(r,3,4));const fifth=_nn(MXU.above(r,5,7));const correct=root+'/'+third;const pool=[root+'/'+third,root+'/'+fifth,third+'/'+root,fifth+'/'+root,third+'/'+fifth];const c=_pick(correct,pool);return{sig:'hi6-'+root,q:`${root} 메이저 코드의 1전위(3음이 베이스)를 슬래시 코드로 표기하면?`,choices:c.choices,answer:c.answer,explain:`1전위는 3음(${third})이 베이스이므로 ${correct} 입니다.`};},

   ()=>{const i=_rint(0,6);const moods=['밝은 장조','세련된 단조','어둡고 이국적','몽환적인 장조','블루지한 장조','슬픈 단조','불안정'];const c=_pick(MODES[i],MODES);return{sig:'hi8-'+i,q:`'${moods[i]}' 분위기로 대표되는 모드(교회선법)는?`,choices:c.choices,answer:c.answer,explain:`'${moods[i]}'는 ${MODES[i]} 모드의 특징입니다.`};},

const SEEN_KEY='ipsi_seen_v1';
function _seenGet(){return Store.get(SEEN_KEY,{});}
function _seenAdd(k,sigs){const s=_seenGet();s[k]=(s[k]||[]).concat(sigs);if(s[k].length>80)s[k]=s[k].slice(-80);Store.set(SEEN_KEY,s);}
function buildSession(sub,lv,count){
  const gens=(GEN[sub]&&GEN[sub][lv])||[]; if(!gens.length)return[];
  const k=sub+'|'+lv; const recent=new Set(_seenGet()[k]||[]);
  const used=new Set(); const out=[]; let tries=0;
  while(out.length<count && tries<count*40){ tries++;
    let q; try{ q=gens[Math.floor(Math.random()*gens.length)](); }catch(e){ continue; }
    if(!q||used.has(q.sig)) continue;
    if(recent.has(q.sig) && tries<count*25) continue;
    q.id=q.sig; used.add(q.sig); out.push(q);
  }
  _seenAdd(k,out.map(q=>q.sig));
  return out;
}

<script>
/* ---------- 학습 통계 ---------- */
const Stats=(()=>{
  const K='ipsi_stats_v1';
  const load=()=>Store.get(K,{sessions:[],byType:{}});
  const save=s=>Store.set(K,s);
  const fmt=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  function record(sub,lv,score,total,results){
    const s=load();
    s.sessions.push({d:Date.now(),day:fmt(new Date()),sub,lv,score,total});
    if(s.sessions.length>500)s.sessions=s.sessions.slice(-500);
    s.byType=s.byType||{};
    (results||[]).forEach(r=>{ const m=(r.sig||'').match(/^[a-z]+[0-9]+/); const pref=m?m[0]:'기타';
      const t=s.byType[pref]=s.byType[pref]||{c:0,n:0}; t.n++; if(r.correct)t.c++; });
    save(s);
  }
  function streak(s){ const set=new Set(s.sessions.map(x=>x.day)); if(!set.size)return 0;
    let d=new Date(),n=0; if(!set.has(fmt(d)))d.setDate(d.getDate()-1);
    while(set.has(fmt(d))){n++;d.setDate(d.getDate()-1);} return n; }
  function summary(){ const s=load();
    const totalQ=s.sessions.reduce((a,x)=>a+x.total,0);
    const totalC=s.sessions.reduce((a,x)=>a+x.score,0);
    return {totalQ,acc:totalQ?Math.round(totalC/totalQ*100):0,streak:streak(s),sessions:s.sessions,byType:s.byType||{}}; }
  function reset(){ save({sessions:[],byType:{}}); }
  return {record,summary,reset};
})();

const NOTE_NAMES=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
function freqToData(f){ const midi=Math.round(69+12*Math.log2(f/440)); const exact=440*Math.pow(2,(midi-69)/12);
  const cents=Math.round(1200*Math.log2(f/exact)); return {midi,name:NOTE_NAMES[(midi%12+12)%12],oct:Math.floor(midi/12)-1,cents}; }
function autoCorrelate(buf,sr){ let SIZE=buf.length,rms=0;
  for(let i=0;i<SIZE;i++){const v=buf[i];rms+=v*v;} rms=Math.sqrt(rms/SIZE); if(rms<0.01)return -1;
  let r1=0,r2=SIZE-1,th=0.2;
  for(let i=0;i<SIZE/2;i++){if(Math.abs(buf[i])<th){r1=i;break;}}
  for(let i=1;i<SIZE/2;i++){if(Math.abs(buf[SIZE-i])<th){r2=SIZE-i;break;}}
  buf=buf.slice(r1,r2);SIZE=buf.length; const c=new Array(SIZE).fill(0);
  for(let i=0;i<SIZE;i++)for(let j=0;j<SIZE-i;j++)c[i]+=buf[j]*buf[j+i];
  let d=0;while(d<SIZE-1&&c[d]>c[d+1])d++; let max=-1,pos=-1;
  for(let i=d;i<SIZE;i++){if(c[i]>max){max=c[i];pos=i;}}
  let T0=pos; const x1=c[T0-1],x2=c[T0],x3=c[T0+1]; const a=(x1+x3-2*x2)/2,b=(x3-x1)/2;
  if(a)T0=T0-b/(2*a); return T0>0?sr/T0:-1; }
let _SS={stream:null,timer:null,target:null};
function ssStop(){ if(_SS.timer){clearInterval(_SS.timer);_SS.timer=null;} if(_SS.stream){_SS.stream.getTracks().forEach(t=>t.stop());_SS.stream=null;} }

let _MCTX=null; const _mctx=()=>{ if(!_MCTX)_MCTX=new (window.AudioContext||window.webkitAudioContext)(); if(_MCTX.state==='suspended')_MCTX.resume(); return _MCTX; };
let _metro={timer:null,beat:0};
function metroClick(accent){ const c=_mctx(),t=c.currentTime; const o=c.createOscillator(),g=c.createGain();
  o.type='square'; o.frequency.value=accent?1600:1050; o.connect(g); g.connect(c.destination);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+0.07);
  o.start(t); o.stop(t+0.08); }
function metroStop(){ if(_metro.timer){clearInterval(_metro.timer);_metro.timer=null;} const b=document.getElementById('metrobtn'); if(b){b.textContent='▶ 시작';b.classList.remove('ghost');} }
function metroStart(bpm,beats){ metroStop(); _metro.beat=0;
  const tick=()=>{ const accent=(_metro.beat%beats===0); metroClick(accent);
    const dot=document.getElementById('metrodot'); if(dot){dot.style.transform='scale(1.45)';dot.style.background=accent?'var(--gold)':'var(--accent2)'; setTimeout(()=>{if(dot)dot.style.transform='scale(1)';},90);} _metro.beat++; };
  tick(); _metro.timer=setInterval(tick,60000/bpm); }

    el.addEventListener('pointerdown',()=>{ Audio.tone(m,0,1.1); el.classList.add('lit'); setTimeout(()=>el.classList.remove('lit'),180); }); });
  // 5도권
  view.querySelectorAll('.cofkey').forEach(el=>{ el.addEventListener('click',()=>playKeyScale(el.dataset.k)); });
}

/* ---------- 모바일 오디오 잠금 해제 ----------
   iOS/모바일은 사용자 제스처 안에서만 오디오를 시작할 수 있어,
   첫 탭에서 무음 톤을 한 번 울려 오디오 컨텍스트를 깨워 둔다. */
(function(){ let done=false;
  function unlock(){ if(done)return; done=true; try{ Audio.tone(69,0,0.01,0); }catch(e){}
    ['touchend','pointerdown','click','keydown'].forEach(ev=>document.removeEventListener(ev,unlock,true)); }
  ['touchend','pointerdown','click','keydown'].forEach(ev=>document.addEventListener(ev,unlock,true));
})();

/* ---------- 홈 화면에 추가(설치) 안내 ---------- */
(function(){
  const dismissed=()=>{try{return localStorage.getItem('a2hs_dismiss')==='1';}catch(e){return false;}};
  const setDismiss=()=>{try{localStorage.setItem('a2hs_dismiss','1');}catch(e){}};
  const standalone=()=>(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
  const isiOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
  function show(html){ if(document.getElementById('a2hs'))return null; const b=document.createElement('div'); b.id='a2hs'; b.innerHTML=html; document.body.appendChild(b); const x=b.querySelector('.x'); if(x)x.onclick=()=>{b.remove();setDismiss();}; return b; }
  if(standalone()||dismissed()) return;
  let deferred=null;
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e;
    const b=show('<span>📱 이 학습앱을 홈 화면에 설치하면 전체화면 앱처럼 쓸 수 있어요.</span><button id="a2hs-go">설치</button><button class="x">✕</button>');
    if(!b)return; b.querySelector('#a2hs-go').onclick=async()=>{ b.remove(); try{deferred.prompt();await deferred.userChoice;}catch(e){} deferred=null; };
  });
  if(isiOS()){ setTimeout(()=>{ if(standalone()||dismissed())return;
    show('<span>📱 홈 화면에 추가: 하단 공유 <b>⬆︎</b> → “홈 화면에 추가” 를 누르면 앱처럼 설치돼요.</span><button class="x">✕</button>');
  },1800); }
})();
</script>
