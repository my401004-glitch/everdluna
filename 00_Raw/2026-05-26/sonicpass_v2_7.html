<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SonicPass — 실용음악 입시 트레이너</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0D0D14;--bg1:#13131f;--bg2:#1a1a2e;--bg3:#22223a;
  --bdr:rgba(255,255,255,.08);--bdr2:rgba(255,255,255,.14);
  --pu:#c8b8ff;--pudim:rgba(200,184,255,.15);
  --gr:#5dca8e;--grdim:rgba(93,202,142,.15);
  --re:#ff6b6b;--redim:rgba(255,107,107,.15);
  --am:#ffb86c;--amdim:rgba(255,184,108,.15);
  --t0:#fff;--t1:#e0dff5;--t2:#a8a8c8;--t3:#7878a0;--t4:#4a4a6a;
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --r:12px;--rl:18px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg0);color:var(--t1);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:100vh;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg1);}
::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px;}
.app{display:flex;min-height:100vh;}
.sidebar{width:220px;flex-shrink:0;background:var(--bg1);border-right:1px solid var(--bdr);display:flex;flex-direction:column;padding:24px 0;position:sticky;top:0;height:100vh;overflow-y:auto;}
.main{flex:1;overflow-y:auto;}
.logo{padding:0 20px 24px;border-bottom:1px solid var(--bdr);margin-bottom:16px;}
.logo-t{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--pu);}
.logo-s{font-size:11px;color:var(--t3);letter-spacing:.05em;text-transform:uppercase;margin-top:2px;}
.ns{padding:0 12px;margin-bottom:8px;}
.nl{font-size:10px;font-weight:600;color:var(--t4);letter-spacing:.08em;text-transform:uppercase;padding:0 8px;margin-bottom:4px;}
.nb{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:none;background:transparent;color:var(--t2);font-family:var(--sans);font-size:13px;cursor:pointer;transition:all .15s;text-align:left;}
.nb:hover{background:var(--bg2);color:var(--t1);}
.nb.active{background:var(--pudim);color:var(--pu);font-weight:500;}
.ni{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;background:var(--bg3);}
.nb.active .ni{background:var(--pudim);}
.sbot{margin-top:auto;padding:16px 12px 0;border-top:1px solid var(--bdr);}
.dl{font-size:10px;font-weight:600;color:var(--t4);letter-spacing:.08em;text-transform:uppercase;padding:0 8px;margin-bottom:6px;}
.dr{display:flex;gap:4px;padding:0 8px;}
.db{flex:1;padding:5px 0;border-radius:7px;border:1px solid var(--bdr);background:transparent;color:var(--t3);font-size:11px;font-family:var(--sans);cursor:pointer;transition:all .15s;}
.db.active{background:var(--pudim);color:var(--pu);border-color:rgba(200,184,255,.3);font-weight:600;}
.streak-w{background:var(--bg2);border-radius:var(--r);padding:12px;margin:0 12px 16px;}
.streak-top{display:flex;align-items:baseline;gap:4px;margin-bottom:8px;}
.sn{font-family:var(--serif);font-style:italic;font-size:28px;color:var(--pu);line-height:1;}
.sbars{display:flex;gap:3px;align-items:flex-end;height:20px;}
.sb{flex:1;border-radius:3px;background:var(--bg3);}
.sb.on{background:var(--pu);}
.ph{padding:32px 40px 24px;border-bottom:1px solid var(--bdr);}
.phi{font-size:11px;color:var(--t3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;}
.pht{font-family:var(--serif);font-style:italic;font-size:32px;color:var(--t0);line-height:1.1;}
.phs{font-size:14px;color:var(--t2);margin-top:4px;}
.content{padding:32px 40px;}
.card{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--rl);padding:24px;}
.csm{padding:16px 20px;}
.ct{font-size:11px;font-weight:600;color:var(--t3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:16px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:10px;border:1px solid var(--bdr2);background:var(--bg2);color:var(--t1);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;}
.btn:hover{background:var(--bg3);}
.bpu{background:var(--pudim);border-color:rgba(200,184,255,.3);color:var(--pu);}
.bpu:hover{background:rgba(200,184,255,.22);}
.blg{padding:14px 28px;font-size:15px;border-radius:12px;}
.bfull{width:100%;justify-content:center;}
.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;}
.bpu2{background:var(--pudim);color:var(--pu);}
.bgr{background:var(--grdim);color:var(--gr);}
.bam{background:var(--amdim);color:var(--am);}
.bre{background:var(--redim);color:var(--re);}
.bdim{background:var(--bg3);color:var(--t3);}
.pw{background:var(--bg3);border-radius:4px;height:4px;overflow:hidden;}
.pf{height:100%;border-radius:4px;background:var(--pu);transition:width .4s;}
.aib{background:var(--bg2);border-left:3px solid var(--pu);border-radius:0 var(--r) var(--r) 0;padding:12px 16px;}
.aibl{font-size:10px;font-weight:600;color:var(--pu);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;}
.cb{width:100%;text-align:left;padding:12px 16px;border-radius:var(--r);border:1px solid var(--bdr);background:var(--bg2);color:var(--t2);font-family:var(--sans);font-size:14px;cursor:pointer;transition:all .15s;margin-bottom:8px;display:block;}
.cb:hover:not(:disabled){border-color:var(--bdr2);color:var(--t1);background:var(--bg3);}
.cb.ok{background:var(--grdim);border-color:rgba(93,202,142,.4);color:var(--gr);}
.cb.ng{background:var(--redim);border-color:rgba(255,107,107,.4);color:var(--re);}
.cb:disabled{cursor:default;}
.kdw{background:var(--bg2);border-radius:var(--r);padding:14px;overflow-x:auto;}
.kbd{display:flex;position:relative;height:90px;width:max-content;margin:0 auto;}
.kw{width:36px;height:90px;background:#e8e6f2;border:1px solid #bbb;border-radius:0 0 6px 6px;cursor:pointer;position:relative;transition:background .1s;flex-shrink:0;}
.kw:hover{background:#d8d6ee;}
.kw.on{background:var(--pu);}
.kl{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--t3);font-weight:500;pointer-events:none;}
.kw.on .kl{color:var(--bg0);}
.kb{width:22px;height:56px;background:var(--bg0);border:1px solid rgba(255,255,255,.1);border-radius:0 0 4px 4px;cursor:pointer;position:absolute;top:0;z-index:2;transition:background .1s;}
.kb:hover{background:#1a1a2e;}
.kb.on{background:#a090e0;}
.pr{width:120px;height:120px;border-radius:50%;border:2px solid var(--pu);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;position:relative;}
.pr::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:1px solid var(--pudim);}
.prnote{font-family:var(--serif);font-style:italic;font-size:42px;color:var(--pu);line-height:1;}
.prc{position:absolute;bottom:12px;font-size:11px;color:var(--t3);}
.pmw{background:var(--bg2);border-radius:var(--r);padding:12px;margin-bottom:16px;}
.pmb{height:6px;background:var(--bg3);border-radius:4px;position:relative;overflow:visible;}
.pmn{position:absolute;top:-5px;width:2px;height:16px;background:var(--pu);border-radius:2px;transition:left .1s;transform:translateX(-50%);}
.pmc{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:2px;height:10px;background:var(--t4);border-radius:2px;}
.stfw{background:var(--bg2);border-radius:var(--r);padding:20px;margin-bottom:16px;overflow-x:auto;}
.sbig{font-family:var(--serif);font-style:italic;font-size:72px;color:var(--pu);line-height:1;}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.sc{background:var(--bg2);border-radius:var(--r);padding:14px 16px;}
.sl{font-size:11px;color:var(--t3);margin-bottom:4px;}
.sv{font-family:var(--serif);font-style:italic;font-size:28px;color:var(--t1);line-height:1;}
.ti{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:var(--r);padding:14px 16px;cursor:pointer;border:1px solid transparent;transition:all .15s;margin-bottom:8px;}
.ti:hover{border-color:var(--bdr);background:var(--bg3);}
.tic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.mg{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:24px;}
.mc{background:var(--bg1);border:1px solid var(--bdr);border-radius:var(--rl);padding:20px;cursor:pointer;transition:all .15s;}
.mc:hover{border-color:var(--bdr2);background:var(--bg2);}
.mic{font-size:28px;margin-bottom:12px;}
.mt{font-family:var(--serif);font-size:18px;margin-bottom:4px;}
.md{font-size:12px;color:var(--t3);margin-bottom:12px;}
.qt{font-family:var(--serif);font-size:20px;color:var(--t1);line-height:1.4;margin-bottom:20px;}
.ldot{width:18px;height:4px;border-radius:2px;background:var(--bg3);}
.ldot.on{background:var(--pu);}
.divider{height:1px;background:var(--bdr);margin:24px 0;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.hg{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:8px;}
.hc{aspect-ratio:1;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;}
.rp{text-align:center;padding:24px;}
.rl{font-size:12px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;}
.lbox{border:1px solid var(--bdr);border-radius:10px;padding:14px;margin-bottom:12px;}
.lkey{background:var(--pudim);border-left:3px solid var(--pu);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--t1);font-weight:500;}
.ltip{background:var(--grdim);border-left:3px solid var(--gr);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--t2);}
.si-meter{background:var(--bg2);border-radius:var(--r);padding:12px 16px;margin-bottom:8px;min-height:44px;font-size:13px;color:var(--t2);display:flex;align-items:center;}
@media(max-width:760px){
  .sidebar{display:none;}
  .content{padding:20px;}
  .ph{padding:20px;}
  .g2{grid-template-columns:1fr;}
  .sg{grid-template-columns:1fr 1fr;}
  .mg{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-t">SonicPass</div>
      <div class="logo-s">실용음악 입시 트레이너</div>
    </div>
    <div class="streak-w">
      <div class="streak-top"><span class="sn" id="snm">7</span><span style="font-size:11px;color:var(--t3)">일 연속</span></div>
      <div class="sbars" id="sbrs"></div>
    </div>
    <div class="ns"><div class="nl">메인</div>
      <button class="nb active" onclick="go('home')"><span class="ni">&#127968;</span>홈</button>
    </div>
    <div class="ns">
      <div class="nl">훈련 모듈</div>
      <button class="nb" onclick="go('ear')"><span class="ni">&#127925;</span>AI 청음 훈련</button>
      <button class="nb" onclick="go('theory')"><span class="ni">&#128218;</span>화성·이론 퀴즈</button>
      <button class="nb" onclick="go('sight')"><span class="ni">&#127932;</span>시창 훈련</button>
    </div>
    <div class="ns"><div class="nl">분석</div>
      <button class="nb" onclick="go('stats')"><span class="ni">&#128202;</span>나의 통계</button>
    </div>
    <div class="sbot">
      <div class="dl">난이도</div>
      <div class="dr">
        <button class="db" onclick="setDiff(1)">입문</button>
        <button class="db active" onclick="setDiff(2)">기본</button>
        <button class="db" onclick="setDiff(3)">심화</button>
      </div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>

/* =========================================================  STATE  ========================================================= */
var S={
  page:'home',diff:2,streak:7,streakH:[1,1,1,0,1,1,1],
  stats:{ear:{correct:34,total:44,level:3},theory:{correct:28,total:32,level:4},sight:{correct:12,total:18,level:2}},
  ear:{on:false,stream:null,actx:null,analyser:null,cur:null,ok:0,tot:0,wrong:{}},
  th:{chIdx:0,qIdx:0,done:false,wrong:[],ok:0,tot:0,mode:'lesson'},
  si:{idx:0,rec:false,score:null,ok:0,tot:0,notes:[],results:[]}
};

/* =========================================================  CONSTANTS  ========================================================= */
var NN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
var KR={C:'도','C#':'도#',D:'레','D#':'레#',E:'미',F:'파','F#':'파#',G:'솔','G#':'솔#',A:'라','A#':'라#',B:'시'};
var FR={C4:261.63,'C#4':277.18,D4:293.66,'D#4':311.13,E4:329.63,F4:349.23,'F#4':369.99,G4:392.00,'G#4':415.30,A4:440.00,'A#4':466.16,B4:493.88,C5:523.25,D5:587.33,E5:659.25};
var SY={C4:94,D4:88,E4:82,F4:76,G4:70,A4:64,B4:58,C5:52,D5:46,E5:40,F5:34};
var SL=[82,70,58,46,34];
var NP={1:['C4','D4','E4','F4','G4'],2:['C4','D4','E4','F4','G4','A4','B4'],3:['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5']};

/* =========================================================  QUESTIONS  ========================================================= */
var QB=[
  {d:1,ch:'3화음 기초',q:'도-미-솔은 어떤 화음인가요?',c:['장화음','단화음','감화음'],a:0,hint:'도-미: 장3도(4반음), 미-솔: 단3도(3반음)',ex:'장3도+단3도=장3화음. C major chord라고도 해요.'},
  {d:1,ch:'3화음 기초',q:'라-도-미는 어떤 화음인가요?',c:['장화음','단화음','감화음'],a:1,hint:'라-도: 단3도(3반음), 도-미: 장3도(4반음)',ex:'단3도+장3도=단3화음. A minor chord예요.'},
  {d:1,ch:'3화음 기초',q:'시-레-파는 어떤 화음인가요?',c:['장화음','단화음','감화음'],a:2,hint:'시-레: 단3도, 레-파: 단3도 - 둘 다 단3도!',ex:'단3도+단3도=감3화음. 불안정한 느낌이 특징이에요.'},
  {d:1,ch:'음정 기초',q:'도(C)에서 솔(G)까지의 음정은?',c:['완전4도','완전5도','장6도'],a:1,hint:'도레미파솔 - 5개 음이름',ex:'도-솔=완전5도(7반음). 가장 안정적인 음정이에요.'},
  {d:1,ch:'음정 기초',q:'도(C)에서 파(F)까지의 음정은?',c:['완전4도','완전5도','장3도'],a:0,hint:'도레미파 - 4개 음이름',ex:'도-파=완전4도(5반음)입니다.'},
  {d:1,ch:'장단조',q:'C장조의 으뜸음(tonic)은?',c:['도(C)','미(E)','솔(G)'],a:0,hint:'장조 이름 앞의 음이 으뜸음',ex:'C장조 으뜸음=C(도). 모든 화성이 C를 중심으로 움직여요.'},
  {d:2,ch:'3화음',q:'C-E-G 화음의 종류는?',c:['장3화음','단3화음','감3화음','증3화음'],a:0,ex:'C-E(장3도)-G(단3도)=장3화음. 장3도+단3도 구조.'},
  {d:2,ch:'3화음',q:'A-C-E 화음의 종류는?',c:['장3화음','단3화음','감3화음','증3화음'],a:1,ex:'A-C(단3도)-E(장3도)=단3화음. 단3도+장3도 구조.'},
  {d:2,ch:'3화음',q:'B-D-F 화음의 종류는?',c:['장3화음','단3화음','감3화음','증3화음'],a:2,ex:'B-D(단3도)-F(단3도)=감3화음. 단3도+단3도.'},
  {d:2,ch:'7화음',q:'G-B-D-F는 어떤 7화음인가요?',c:['장7화음','속7화음','단7화음','감7화음'],a:1,ex:'G장3화음+단7도=속7화음(dominant 7th). V도.'},
  {d:2,ch:'7화음',q:'C-E-G-B 화음의 종류는?',c:['장7화음','속7화음','단7화음','반감7화음'],a:0,ex:'C장3화음+장7도=장7화음(major 7th).'},
  {d:2,ch:'7화음',q:'B-D-F-A 화음의 이름은?',c:['장7화음','속7화음','반감7화음','감7화음'],a:2,ex:'B감3화음+단7도=반감7화음.'},
  {d:2,ch:'전위',q:'제1전위에서 베이스(가장 낮은) 음은?',c:['근음(root)','3음(third)','5음(fifth)','7음(seventh)'],a:1,ex:'제1전위=3음이 베이스. 6화음이라고도 해요.'},
  {d:2,ch:'전위',q:'제2전위의 베이스는?',c:['근음','3음','5음','7음'],a:2,ex:'제2전위=5음이 베이스. 64화음이라 합니다.'},
  {d:3,ch:'기능화성',q:'C장조에서 G7의 기능은?',c:['으뜸(T)','버금딸림(S)','딸림(D)','대리화음'],a:2,ex:'G7=C장조 V7. 가장 강한 딸림기능으로 으뜸화음을 이끌어요.'},
  {d:3,ch:'기능화성',q:'C장조의 IV도 화음은?',c:['C major','F major','G major','A minor'],a:1,ex:'C장조 IV도=F(파). 버금딸림화음(S).'},
  {d:3,ch:'조성분석',q:'C장조에서 vi 화음은?',c:['A major','A minor','F major','E minor'],a:1,ex:'vi=장음계 6번째 음(A)위의 단3화음 A minor.'},
  {d:3,ch:'조성분석',q:'D장조의 이끔음(leading tone)은?',c:['C#','D','F#','A'],a:0,ex:'이끔음=장음계 7번째 음. D장조=C#.'},
  {d:3,ch:'변화화음',q:'나폴리 6화음(N6)은?',c:['II도 제1전위','bII도 제1전위','IV도 제2전위','VII도 제1전위'],a:1,ex:'나폴리 6화음=반음 내린 II도(bII)의 제1전위.'},
  {d:3,ch:'모달',q:'도리안(Dorian) 선법과 자연단음계의 차이는?',c:['6음이 반음 높다','7음이 반음 높다','2음이 반음 낮다','3음이 반음 높다'],a:0,ex:'도리안=자연단음계에서 6번째 음이 반음 높아요.'}
];

/* =========================================================  HELPERS  ========================================================= */
function dlabel(){return ['','입문','기본','심화'][S.diff];}
function getChs(d){
  var seen={},r=[];
  QB.filter(function(q){return q.d===d;}).forEach(function(q){if(!seen[q.ch]){seen[q.ch]=1;r.push(q.ch);}});
  return r;
}
function getQs(d,ch){return QB.filter(function(q){return q.d===d&&q.ch===ch;});}
function m2f(m){return 440*Math.pow(2,(m-69)/12);}
function playtone(note){
  try{
    var ctx=new(window.AudioContext||window.webkitAudioContext)();
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    o.type='triangle';o.frequency.value=FR[note]||440;
    g.gain.setValueAtTime(0.3,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+1.2);
    o.start();o.stop(ctx.currentTime+1.2);
  }catch(e){}
}
function gennotes(d){
  var pool=NP[d]||NP[2],notes=[],prev=null;
  for(var i=0;i<8;i++){
    var n,t=0;
    do{n=pool[Math.floor(Math.random()*pool.length)];t++;}while(n===prev&&t<10);
    notes.push({name:n});prev=n;
  }
  return notes;
}
function centsOff(det,exp){return(det&&exp)?Math.round(1200*Math.log2(det/exp)):null;}

/* =========================================================  INLINE PITCH DETECTOR (CDN 불필요)  ========================================================= */
function detectPitch(analyser,sampleRate){
  if(!analyser)return null;
  var n=analyser.fftSize;
  var buf=new Float32Array(n);
  analyser.getFloatTimeDomainData(buf);
  /* RMS 에너지 체크 */
  var rms=0;
  for(var i=0;i<n;i++)rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/n);
  if(rms<0.008)return null;
  /* 자기상관(autocorrelation) 기반 피치 추출 */
  var half=Math.floor(n/2);
  var c=new Float32Array(half);
  for(var tau=0;tau<half;tau++){
    for(var j=0;j<half;j++)c[tau]+=buf[j]*buf[j+tau];
  }
  /* 처음 하강 구간 이후 최대값 찾기 */
  var d=0;
  while(c[d]>c[d+1]&&d<half-2)d++;
  var maxV=-1,maxT=-1;
  for(var tau=d;tau<half;tau++){
    if(c[tau]>maxV){maxV=c[tau];maxT=tau;}
  }
  if(maxT<=0||maxT>=half-1)return null;
  if(c[0]>0&&maxV/c[0]<0.5)return null;/* 신뢰도 체크 */
  /* 포물선 보간으로 정밀도 향상 */
  var p=c[maxT-1],q=c[maxT],r=c[maxT+1];
  var a=(p+r-2*q)/2,b=(r-p)/2;
  var refined=a?maxT-b/(2*a):maxT;
  if(refined<=0)return null;
  var freq=sampleRate/refined;
  if(freq<60||freq>2000)return null;
  return freq;
}

/* =========================================================  NAVIGATION  ========================================================= */
function go(page){
  if(S.ear.on)stopMic();
  clearInterval(_thTimer);
  S.page=page;
  document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('active');});
  document.querySelectorAll('.nb').forEach(function(b){
    var oc=b.getAttribute('onclick')||'';
    if(oc.indexOf("'"+page+"'")>=0)b.classList.add('active');
  });
  render();
}
function setDiff(d){
  S.diff=d;
  document.querySelectorAll('.db').forEach(function(b,i){b.classList.toggle('active',i===d-1);});
  S.si.notes=gennotes(d);S.si.idx=0;
  S.th.chIdx=0;S.th.qIdx=0;S.th.done=false;S.th.mode='lesson';
  clearInterval(_thTimer);render();
}

/* =========================================================  RENDER  ========================================================= */
function render(){
  var m=document.getElementById('main');if(!m)return;
  if(S.page==='home')  m.innerHTML=renderHome();
  if(S.page==='ear')   {m.innerHTML=renderEar();buildPiano('ekbd');newEarQ();}
  if(S.page==='theory'){
    m.innerHTML=renderTheory();
    if(S.diff!==3&&S.th.mode==='quiz')buildPiano('thkbd');
    if(S.diff===3&&S.th.mode==='quiz')startTimer();
  }
  if(S.page==='sight'){m.innerHTML=renderSight();drawStaff();}
  if(S.page==='stats'){m.innerHTML=renderStats();drawHeatmap();}
  renderStreak();
}

function checkEar(user){
  if(!S.ear.cur)return;

  var fb=document.getElementById('efb');
  if(fb){

var _earMic={on:false,stream:null,actx:null,analyser:null};
function toggleMic(){
  if(_earMic.on){stopMic();return;}
  navigator.mediaDevices.getUserMedia({audio:true,video:false}).then(function(stream){
    _earMic.stream=stream;
    _earMic.actx=new(window.AudioContext||window.webkitAudioContext)();
    var src=_earMic.actx.createMediaStreamSource(stream);
    _earMic.analyser=_earMic.actx.createAnalyser();
    _earMic.analyser.fftSize=2048;
    src.connect(_earMic.analyser);
    _earMic.on=true;
    S.ear.on=true;
    var b=document.getElementById('mbtn');if(b)b.textContent='⏹ 마이크 중지';
    var s=document.getElementById('mst');if(s){s.style.color='var(--gr)';s.textContent='🎤 감지 중...';}
    earLoop();
  }).catch(function(){
    var s=document.getElementById('mst');if(s)s.textContent='마이크 권한이 필요해요';
  });
}
function stopMic(){
  _earMic.on=false;S.ear.on=false;
  if(_earMic.stream)_earMic.stream.getTracks().forEach(function(t){t.stop();});
  var b=document.getElementById('mbtn');if(b)b.textContent='🎤 마이크 시작';
  var s=document.getElementById('mst');if(s){s.style.color='var(--t3)';s.textContent='마이크 버튼을 눌러 시작하세요';}
}
function earLoop(){
  if(!_earMic.on)return;
  var f=detectPitch(_earMic.analyser,_earMic.actx?_earMic.actx.sampleRate:44100);
  if(f){
    var midi=Math.round(12*Math.log2(f/440)+69);
    var cts=Math.round(1200*Math.log2(f/m2f(midi)));
    var nn=NN[midi%12];
    var ne=document.getElementById('pnote');if(ne)ne.textContent=KR[nn]||nn;
    var nd=document.getElementById('pneedle');if(nd)nd.style.left=(50+cts/2)+'%';
    var ce=document.getElementById('pcents');if(ce)ce.textContent=(cts>=0?'+':'')+cts+'c';
  }
  requestAnimationFrame(earLoop);
}

  clearInterval(_thTimer);
  var d=S.diff,clist=getChs(d),qlist=getQs(d,clist[S.th.chIdx]);
  if(S.th.qIdx<qlist.length-1)S.th.qIdx++;
  else if(S.th.chIdx<clist.length-1){S.th.chIdx++;S.th.qIdx=0;}
  S.th.done=false;render();
  if(S.diff!==3)buildPiano('thkbd');
  if(S.diff===3)startTimer();
}
function prevQ(){
  clearInterval(_thTimer);
  if(S.th.qIdx>0){S.th.qIdx--;S.th.done=false;render();if(S.diff!==3)buildPiano('thkbd');if(S.diff===3)startTimer();}
}
function exportW(){
  var b=new Blob([JSON.stringify({at:new Date().toISOString(),wrong:S.th.wrong},null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sonicpass_오답노트.json';a.click();
}

/* =========================================================  SIGHT-SINGING  ========================================================= */
var _siMic={on:false,stream:null,actx:null,analyser:null};
var _siTimer=null,_siNoteI=0,_siBuf=[];
function renderSight(){
  if(!S.si.notes||!S.si.notes.length)S.si.notes=gennotes(S.diff);
  var pct=S.si.tot?Math.round(S.si.ok/S.si.tot*100):0;
  var sc=S.si.score;
  var dc={1:'var(--gr)',2:'var(--am)',3:'var(--re)'};
  var dd={1:'도레미파솔 5음',2:'C장조 7음계',3:'10음 확장'};
  var dm={1:'입문: 도레미파솔 5음 범위. 기준음 버튼으로 각 음을 먼저 확인하세요.',2:'기본: C장조 7음계. 시창 시작 후 악보 보며 노래하세요.',3:'심화: C4~E5 10음 범위. C4는 보조선 아래 음이에요.'};
  var ns='';
  S.si.notes.forEach(function(n,i){
    var kr=KR[n.name.replace(/\d/,'')]||n.name,act=i===S.si.idx;
    ns+='<span id="ns'+i+'" style="font-size:14px;font-family:var(--serif);font-style:italic;color:'+(act?'var(--pu)':'var(--t3)')+';padding:4px 10px;background:'+(act?'var(--pudim)':'transparent')+';border-radius:6px;transition:all .2s">'+kr+'</span>';
  });
  var rb='';
  S.si.notes.forEach(function(n,i){
    var kr=KR[n.name.replace(/\d/,'')]||n.name;
    rb+='<button class="btn" style="font-size:13px;font-family:var(--serif);font-style:italic;padding:7px 12px" onclick="playSN(\''+n.name+'\','+i+')">'+kr+'</button>';
  });
  var sp='';
  if(sc!==null){
    var scol=sc>=80?'var(--gr)':sc>=60?'var(--am)':'var(--re)';
    sp='<div class="card"><div class="rp">'
      +'<div class="rl">최근 시창 점수</div>'
      +'<div class="sbig" style="color:'+scol+'">'+sc+'</div>'
      +'<div style="font-size:14px;color:var(--t3);margin-top:4px">/ 100점</div>'
      +'<div style="margin-top:16px">'
      +'<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="color:var(--t3)">음정 정확도</span><span style="color:var(--pu)">'+Math.min(sc+5,100)+'%</span></div>'
      +'<div class="pw"><div class="pf" style="width:'+Math.min(sc+5,100)+'%"></div></div></div>'
      +'<div style="margin-top:10px">'
      +'<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px"><span style="color:var(--t3)">박자 정확도</span><span style="color:var(--gr)">'+Math.max(sc-3,0)+'%</span></div>'
      +'<div class="pw"><div class="pf" style="width:'+Math.max(sc-3,0)+'%;background:var(--gr)"></div></div></div>'
      +'</div></div>';
  }
  return '<div class="ph"><div class="phi">훈련 모듈 03</div><div class="pht">시창 훈련</div>'
    +'<div class="phs">악보를 보고 노래하면 마이크가 음정을 실시간 감지합니다 · <span style="color:'+dc[S.diff]+'">'+dlabel()+' — '+dd[S.diff]+'</span></div></div>'
    +'<div class="content"><div class="g2">'
    +'<div>'
    +'<div class="card" style="margin-bottom:16px">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'
    +'<div class="ct" style="margin-bottom:0">오늘의 악보 — C장조 · 4/4박자</div>'
    +'<button class="btn" style="font-size:12px;padding:5px 12px" onclick="newSight()">🎲 새 악보</button></div>'
    +'<div class="stfw"><canvas id="stcv" width="500" height="130" style="max-width:100%;display:block;margin:0 auto"></canvas></div>'
    +'<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:10px;justify-content:center" id="nnames">'+ns+'</div></div>'
    +'<div class="card csm" style="margin-bottom:16px"><div class="ct">기준음 재생 — 클릭해서 미리 확인</div>'
    +'<div style="display:flex;gap:6px;flex-wrap:wrap">'+rb+'</div></div>'
    +'<div class="si-meter" id="simtr">시창 시작 버튼을 누르면 실시간 음정 감지가 시작돼요</div>'
    +'<button class="btn bpu blg bfull" onclick="toggleSight()">'
    +'<span id="siico">🎤</span> <span id="silbl">시창 시작</span></button>'
    +'</div>'
    +'<div style="display:flex;flex-direction:column;gap:14px">'
    +sp
    +'<div class="card csm"><div class="ct">세션 통계</div>'
    +'<div style="display:flex;gap:20px">'
    +'<div><div style="font-family:var(--serif);font-style:italic;font-size:32px;color:var(--am);line-height:1">'+pct+'</div><div style="font-size:11px;color:var(--t3)">정답률</div></div>'
    +'<div><div style="font-family:var(--serif);font-style:italic;font-size:32px;color:var(--t2);line-height:1">'+S.si.tot+'</div><div style="font-size:11px;color:var(--t3)">완료 횟수</div></div>'
    +'</div></div>'
    +'<div class="card csm"><div class="ct">✦ AI 시창 코치</div>'
    +'<div id="sifb"><div class="aib" style="border-color:var(--am)"><div class="aibl" style="color:var(--am)">✦ SonicPass AI</div>'
    +'<div style="font-size:13px;color:var(--t2)">'+dm[S.diff]+'</div></div></div>'
    +'</div></div></div></div>';
}
function drawStaff(){
  var cv=document.getElementById('stcv');
  if(!cv||!S.si.notes||!S.si.notes.length)return;
  var ctx=cv.getContext('2d'),W=cv.width;
  ctx.clearRect(0,0,W,cv.height);
  var LC='rgba(168,168,200,0.22)',NC='#d0cfec',AC='#c8b8ff';
  SL.forEach(function(y){ctx.strokeStyle=LC;ctx.lineWidth=0.9;ctx.beginPath();ctx.moveTo(24,y);ctx.lineTo(W-8,y);ctx.stroke();});
  ctx.fillStyle='rgba(168,168,200,0.55)';ctx.font='bold 64px serif';ctx.fillText('\uD834\uDD1E',2,95);
  ctx.fillStyle='rgba(168,168,200,0.65)';ctx.font='bold 20px serif';ctx.fillText('4',34,52);ctx.fillText('4',34,78);
  var notes=S.si.notes,sx=62,sp2=Math.floor((W-sx-12)/notes.length);
  notes.forEach(function(n,i){
    var x=sx+i*sp2+sp2*0.45,y=SY[n.name]||82,act=i===S.si.idx,fill=act?AC:NC;
    if(n.name==='C4'){ctx.strokeStyle=act?AC:'rgba(168,168,200,0.5)';ctx.lineWidth=0.9;ctx.beginPath();ctx.moveTo(x-11,y);ctx.lineTo(x+11,y);ctx.stroke();}
    ctx.fillStyle=fill;ctx.beginPath();ctx.ellipse(x,y,8,6,-0.25,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle=fill;ctx.lineWidth=1.4;ctx.beginPath();
    if(y<=58){ctx.moveTo(x-8,y);ctx.lineTo(x-8,y+34);}else{ctx.moveTo(x+8,y);ctx.lineTo(x+8,y-34);}
    ctx.stroke();
  });
  if(notes.length>4){var bx=sx+4*sp2+sp2*0.5+sp2*0.3;ctx.strokeStyle='rgba(168,168,200,0.35)';ctx.lineWidth=0.9;ctx.beginPath();ctx.moveTo(bx,SL[4]);ctx.lineTo(bx,SL[0]);ctx.stroke();}
  var ex=W-10;ctx.strokeStyle='rgba(168,168,200,0.35)';ctx.lineWidth=0.9;ctx.beginPath();ctx.moveTo(ex-5,SL[4]);ctx.lineTo(ex-5,SL[0]);ctx.stroke();ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(ex,SL[4]);ctx.lineTo(ex,SL[0]);ctx.stroke();
}
function hlNote(idx){
  S.si.idx=idx;
  for(var i=0;i<S.si.notes.length;i++){
    var el=document.getElementById('ns'+i);if(!el)continue;
    el.style.color=i===idx?'var(--pu)':'var(--t3)';
    el.style.background=i===idx?'var(--pudim)':'transparent';
  }
}
function playSN(note,idx){hlNote(idx);drawStaff();playtone(note);}
/* toggleSight — 인라인 피치 감지기로 음정 채점 */
function toggleSight(){
  if(S.si.rec){clearInterval(_siTimer);stopSiMic();finishSight();return;}
  S.si.rec=true;S.si.results=[];_siNoteI=0;_siBuf=[];
  var lbl=document.getElementById('silbl'),ico=document.getElementById('siico');
  if(lbl)lbl.textContent='⏹ 채점 중지';
  if(ico)ico.textContent='⏺';
  navigator.mediaDevices.getUserMedia({audio:true,video:false}).then(function(stream){
    _siMic.stream=stream;
    _siMic.actx=new(window.AudioContext||window.webkitAudioContext)();
    var src=_siMic.actx.createMediaStreamSource(stream);
    _siMic.analyser=_siMic.actx.createAnalyser();
    _siMic.analyser.fftSize=2048;
    src.connect(_siMic.analyser);
    _siMic.on=true;
    var mt=document.getElementById('simtr');
    if(mt)mt.innerHTML='<span style="color:var(--gr)">🎤 감지 중 — 악보를 보고 노래하세요!</span> <span id="sipitch" style="color:var(--t2)"></span>';
    siRafLoop();
    startSiSeq();
  }).catch(function(){
    var mt=document.getElementById('simtr');
    if(mt)mt.innerHTML='<span style="color:var(--am)">마이크 권한 없음 — 시각 연습으로 진행합니다</span>';
    startSiSeq();
  });
}
function siRafLoop(){
  if(!_siMic.on)return;
  var f=detectPitch(_siMic.analyser,_siMic.actx?_siMic.actx.sampleRate:44100);
  if(f){
    _siBuf.push(f);
    /* 실시간 피치 표시 */
    var midi=Math.round(12*Math.log2(f/440)+69);
    var nn=NN[midi%12];
    var sp=document.getElementById('sipitch');
    if(sp)sp.textContent='| 감지: '+( KR[nn]||nn );
  }
  requestAnimationFrame(siRafLoop);
}
function startSiSeq(){
  hlNote(0);drawStaff();
  _siTimer=setInterval(function(){
    /* 이전 음표 평가 */
    if(_siNoteI>0){
      var pn=S.si.notes[_siNoteI-1].name;
      var det=_siBuf.length>0?_siBuf.reduce(function(a,b){return a+b;},0)/_siBuf.length:null;
      var cts=det?centsOff(det,FR[pn]):null;
      var ok=det!==null&&Math.abs(cts)<=80;
      S.si.results.push({note:pn,det:det,cts:cts,ok:ok});
      /* 피치 미터 업데이트 */
      var mt=document.getElementById('simtr');
      if(mt&&det){
        var kr=KR[pn.replace(/\d/,'')]||pn;
        var midi2=Math.round(12*Math.log2(det/440)+69);
        var dn=NN[midi2%12],dkr=KR[dn]||dn;
        var col=ok?'var(--gr)':cts>0?'var(--re)':'var(--am)';
        var msg=ok?'✓ 정확!':cts>0?'♯ 너무 높아요':'♭ 너무 낮아요';
        mt.innerHTML='목표: <strong style="color:var(--pu)">'+kr+'</strong> &nbsp;|&nbsp; 감지: <strong style="color:'+col+'">'+dkr+'</strong> &nbsp;<span style="color:'+col+'">'+msg+' ('+(cts>=0?'+':'')+cts+'&cent;)</span>';
      }
    }
    _siBuf=[];
    if(_siNoteI>=S.si.notes.length){
      clearInterval(_siTimer);
      setTimeout(function(){stopSiMic();finishSight();},400);
      return;
    }
    hlNote(_siNoteI);drawStaff();_siNoteI++;
  },900);
}
function stopSiMic(){
  _siMic.on=false;
  if(_siMic.stream)_siMic.stream.getTracks().forEach(function(t){t.stop();});
}
function finishSight(){
  S.si.rec=false;
  var res=S.si.results,sc;
  if(res&&res.length>0){
    var okn=res.filter(function(r){return r.ok;}).length;
    var att=res.filter(function(r){return r.det!==null;}).length;
    sc=Math.round((okn/res.length)*100);
    if(att===res.length)sc=Math.min(sc+5,100);
  }else{
    var base=S.diff===1?70:S.diff===3?50:60;
    sc=base+Math.floor(Math.random()*20);
  }
  S.si.score=sc;S.si.tot++;if(sc>=70)S.si.ok++;
  var wn=res?res.filter(function(r){return !r.ok&&r.det!==null;}).map(function(r){return KR[r.note.replace(/\d/,'')]||r.note;}).join(', '):'';
  var mn=res?res.filter(function(r){return r.det===null;}).map(function(r){return KR[r.note.replace(/\d/,'')]||r.note;}).join(', '):'';
  var msg;
  if(!res||res.length===0)msg='마이크 없이 시각 연습을 했어요. 다음엔 마이크를 허용하면 정확한 채점이 가능해요.';
  else if(sc>=85)msg='훌륭해요! 음정 정확도가 매우 높습니다!';
  else if(sc>=70)msg='잘 하고 있어요!'+(wn?' 틀린 음: '+wn+'.':'')+(mn?' 미감지 음: '+mn+'.':'');
  else msg='괜찮아요! '+(mn?'마이크에 더 가까이서 노래해봐요 (미감지: '+mn+').':'음정 연습을 더 해봐요.')+' 기준음 버튼으로 각 음을 먼저 익혀보세요.';
  var fb=document.getElementById('sifb');
  if(fb){
    var bc=sc>=70?'var(--gr)':'var(--am)';
    fb.innerHTML='<div class="aib" style="border-color:'+bc+'"><div class="aibl" style="color:'+bc+'">✦ AI 채점 — '+sc+'점</div><div style="font-size:13px;color:var(--t2);line-height:1.7">'+msg+'</div></div>';
  }
  render();
}
function newSight(){
  clearInterval(_siTimer);stopSiMic();
  S.si.rec=false;S.si.idx=0;S.si.score=null;S.si.results=[];
  S.si.notes=gennotes(S.diff);render();
}

/* =========================================================  STATS  ========================================================= */

  var tc=S.stats.ear.correct+S.stats.theory.correct+S.stats.sight.correct;
  var tq=S.stats.ear.total+S.stats.theory.total+S.stats.sight.total;
  var pct=tq?Math.round(tc/tq*100):0;
  var eP=Math.round(S.stats.ear.correct/S.stats.ear.total*100);
  var tP=Math.round(S.stats.theory.correct/S.stats.theory.total*100);
  var sP=Math.round(S.stats.sight.correct/S.stats.sight.total*100);
  var wr='';
  if(S.th.wrong.length===0)wr='<div style="font-size:14px;color:var(--t3);padding:12px 0">아직 오답이 없어요.</div>';
  S.th.wrong.slice(-6).forEach(function(w){
    wr+='<div style="padding:10px 12px;background:var(--bg2);border-radius:10px;border:1px solid var(--redim);margin-bottom:6px">'
      +'<div style="font-size:12px;color:var(--re);margin-bottom:3px">✗ '+w.q.slice(0,32)+'...</div>'

  return '<div class="ph"><div class="phi">나의 분석</div><div class="pht">학습 통계</div>'
    +'<div class="phs">약점 분석 · 오답 패턴 · 성장 추이를 확인하세요</div></div>'
    +'<div class="content"><div class="sg" style="margin-bottom:24px">'
    +'<div class="sc"><div class="sl">전체 정답률</div><div class="sv" style="color:var(--pu)">'+pct+'<span style="font-size:16px;color:var(--t3)">%</span></div><div class="pw" style="margin-top:8px"><div class="pf" style="width:'+pct+'%"></div></div></div>'
    +'<div class="sc"><div class="sl">청음 정답률</div><div class="sv">'+eP+'<span style="font-size:16px;color:var(--t3)">%</span></div><div style="font-size:11px;color:var(--t3);margin-top:2px">총 '+S.stats.ear.total+'문항</div></div>'
    +'<div class="sc"><div class="sl">화성 정답률</div><div class="sv" style="color:var(--gr)">'+tP+'<span style="font-size:16px;color:var(--t3)">%</span></div><div style="font-size:11px;color:var(--t3);margin-top:2px">총 '+S.stats.theory.total+'문항</div></div>'
    +'</div>'
    +'<div class="g2">'
    +'<div class="card"><div class="ct">약점 음정 히트맵</div>'
    +'<div style="font-size:12px;color:var(--t3);margin-bottom:8px">색이 진할수록 많이 틀린 음정</div>'
    +'<div class="hg" id="hmap"></div>'
    +'<div style="display:flex;gap:8px;margin-top:10px;align-items:center">'
    +'<div style="width:12px;height:12px;border-radius:3px;background:var(--bg3)"></div><span style="font-size:11px;color:var(--t3)">정확</span>'
    +'<div style="width:12px;height:12px;border-radius:3px;background:var(--am);margin-left:8px"></div><span style="font-size:11px;color:var(--t3)">보통</span>'
    +'<div style="width:12px;height:12px;border-radius:3px;background:var(--re);margin-left:8px"></div><span style="font-size:11px;color:var(--t3)">집중 필요</span>'
    +'</div></div>'
    +'<div class="card"><div class="ct">모듈별 현황</div>'
    +'<div style="display:flex;flex-direction:column;gap:16px">'
    +'<div><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span>🎵</span><span style="font-size:13px;font-weight:500">청음</span><span style="font-size:12px;color:var(--pu);font-weight:600;margin-left:auto">Lv.'+S.stats.ear.level+' · '+eP+'%</span></div><div class="pw"><div class="pf" style="width:'+eP+'%"></div></div></div>'
    +'<div><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span>📖</span><span style="font-size:13px;font-weight:500">화성</span><span style="font-size:12px;color:var(--gr);font-weight:600;margin-left:auto">Lv.'+S.stats.theory.level+' · '+tP+'%</span></div><div class="pw"><div class="pf" style="width:'+tP+'%;background:var(--gr)"></div></div></div>'
    +'<div><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span>🎼</span><span style="font-size:13px;font-weight:500">시창</span><span style="font-size:12px;color:var(--am);font-weight:600;margin-left:auto">Lv.'+S.stats.sight.level+' · '+sP+'%</span></div><div class="pw"><div class="pf" style="width:'+sP+'%;background:var(--am)"></div></div></div>'
    +'</div></div>'
    +'</div>'
    +'<div class="card" style="margin-top:16px"><div class="ct">오답 노트 ('+S.th.wrong.length+'개)</div>'+wr
    +(S.th.wrong.length>0?'<button class="btn bpu" style="margin-top:12px" onclick="exportW()">📥 JSON 내보내기</button>':'')

}
function drawHeatmap(){
  var grid=document.getElementById('hmap');if(!grid)return;
  var w=S.ear.wrong,vals=Object.values(w),mx=vals.length?Math.max.apply(null,vals):1;
  grid.innerHTML=NN.map(function(n){
    var cnt=w[n]||0,r=cnt/mx,bg='var(--bg3)',tc='var(--t4)';
    if(r>0.7){bg='rgba(255,107,107,.7)';tc='#fff';}
    else if(r>0.3){bg='rgba(255,184,108,.5)';tc='#fff';}
    else if(r>0){bg='rgba(255,184,108,.25)';tc='var(--am)';}
    return '<div class="hc" style="background:'+bg+';color:'+tc+'" title="'+KR[n]+': '+cnt+'회">'+KR[n]+'</div>';
  }).join('');
}

/* =========================================================  INIT  ========================================================= */
try{var sw=localStorage.getItem('sp_w');if(sw)S.th.wrong=JSON.parse(sw);}catch(e){}
S.si.notes=gennotes(S.diff);
go('home');
